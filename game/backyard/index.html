<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Nicko's Backyard</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#BFE3F2;font-family:system-ui,sans-serif;
    user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none}
  #game{position:fixed;inset:0;overflow:hidden}
  #bg{position:absolute;inset:0;z-index:0;background:linear-gradient(to bottom,#BFE3F2 0%,#BFE3F2 65%,#7BC96F 65%,#7BC96F 100%)}
  .sprite{position:absolute;z-index:10;touch-action:none;cursor:pointer}
  .sprite svg{width:100%;height:100%;display:block;overflow:visible;pointer-events:none}
  .sprite.lift{z-index:40;filter:drop-shadow(0 10px 10px rgba(0,0,0,.25))}
  .particle{position:absolute;z-index:45;pointer-events:none;font-weight:800}
  .sparkle{position:absolute;z-index:45;pointer-events:none;animation:spark 1.1s ease-out forwards}
  @keyframes spark{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
  #hud{position:absolute;top:calc(10px + env(safe-area-inset-top));right:12px;z-index:50;display:flex;gap:10px}
  .hbtn{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.92);border:2.5px solid #2E2A26;
    display:flex;align-items:center;justify-content:center;box-shadow:2px 2px 0 rgba(46,42,38,.35);cursor:pointer}
  .hbtn:active{transform:scale(.92)}
  .hbtn svg{width:24px;height:24px}
  .wobble{animation:wob .6s ease}
  @keyframes wob{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg)}50%{transform:rotate(3deg)}75%{transform:rotate(-2deg)}}
  #swingArm{transform-box:fill-box;transform-origin:50% 0%}
  #swingArm.swinging{animation:swing 1.1s ease-in-out 4}
  @keyframes swing{0%,100%{transform:rotate(14deg)}50%{transform:rotate(-14deg)}}
  #dog{transition:transform .45s ease}
  #dog.out{transform:translateY(-24px)}
  #dog .dtail{transform-box:fill-box;transform-origin:left center}
  #dog.out .dtail{animation:wag .4s ease-in-out infinite}
  @keyframes wag{0%,100%{transform:rotate(0)}50%{transform:rotate(30deg)}}
  #can.tilt{transform:rotate(-28deg)}
  #can{transition:transform .3s ease}
  #rainbow{transition:opacity 1s ease}
  #nicko .eyesOpen{transform-box:fill-box;transform-origin:center}
  #nicko.blink .eyesOpen{transform:scaleY(.12)}
  #nicko .tail{transform-box:fill-box;transform-origin:left center;animation:wag2 2.6s ease-in-out infinite}
  @keyframes wag2{0%,100%{transform:rotate(0)}50%{transform:rotate(24deg)}}
  #nicko .breathe{transform-box:fill-box;transform-origin:center;animation:breath 3s ease-in-out infinite}
  @keyframes breath{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}
  #nicko.walking .breathe{animation:bbob .32s ease-in-out infinite}
  @keyframes bbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6%)}}
  #nicko.happyjump{animation:hjump .55s ease}
  @keyframes hjump{0%{transform:translateY(0) scale(1)}35%{transform:translateY(-16%) scale(1.04,.94)}70%{transform:translateY(0) scale(.96,1.05)}100%{transform:translateY(0) scale(1)}}
</style>
</head>
<body>

      <g stroke="#B9C0C5" stroke-width="2" stroke-linecap="round">
        <line x1="34" y1="52" x2="14" y2="48"/><line x1="34" y1="57" x2="15" y2="58"/><line x1="86" y1="52" x2="106" y2="48"/><line x1="86" y1="57" x2="105" y2="58"/>
      </g>
      <circle cx="40" cy="52" r="4" fill="#F5B8C1" opacity=".55"/><circle cx="80" cy="52" r="4" fill="#F5B8C1" opacity=".55"/>
    </g>
  </svg></div>

  <div id="hud">
    <div class="hbtn" id="soundBtn" title="sound">
      <svg viewBox="0 0 24 24" id="sndOn"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="#2E2A26"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11" stroke="#2E2A26" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
      <svg viewBox="0 0 24 24" id="sndOff" style="display:none"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="#2E2A26"/><line x1="16" y1="9" x2="22" y2="15" stroke="#F0504D" stroke-width="2.4" stroke-linecap="round"/><line x1="22" y1="9" x2="16" y2="15" stroke="#F0504D" stroke-width="2.4" stroke-linecap="round"/></svg>
    </div>
    <div class="hbtn" id="resetBtn" title="reset">
      <svg viewBox="0 0 24 24"><path d="M12 13c-2.8 0-5.5 1.1-5.5 3.2 0 1.5 1.2 2.3 2.6 2.3 1 0 1.7-.5 2.9-.5s1.9.5 2.9.5c1.4 0 2.6-.8 2.6-2.3 0-2.1-2.7-3.2-5.5-3.2z" fill="#2E2A26"/><ellipse cx="5.5" cy="10" rx="1.8" ry="2.4" fill="#2E2A26"/><ellipse cx="9.5" cy="6.8" rx="1.8" ry="2.4" fill="#2E2A26"/><ellipse cx="14.5" cy="6.8" rx="1.8" ry="2.4" fill="#2E2A26"/><ellipse cx="18.5" cy="10" rx="1.8" ry="2.4" fill="#2E2A26"/></svg>
    </div>
  </div>
</div><!-- /#game -->

<script src="../shared.js"></script>
<script>
(function(){
"use strict";
const game=document.getElementById('game');
let S=1,OX=0,OY=0;
function measure(){
  const w=game.clientWidth,h=game.clientHeight;
  S=Math.min(w/100,h/160); OX=(w-100*S)/2; OY=(h-160*S)/2;
}
const toPx=(x,y)=>[OX+x*S,OY+y*S];
const toUnits=(px,py)=>[(px-OX)/S,(py-OY)/S];
function place(el,x,y,w,animate){
  const[px,py]=toPx(x,y); el._x=x; el._y=y;
  const sz=w*S;
  el.style.width=sz+'px'; el.style.height=(sz*(el._ratio||1))+'px';
  el.style.transition=animate?'left .6s ease,top .6s ease':'';
  el.style.left=(px-sz/2)+'px'; el.style.top=(py-sz*(el._ratio||1)/2)+'px';
}
function near(a,b,d){const dx=(a._x||0)-(b._x||0),dy=(a._y||0)-(b._y||0);return Math.hypot(dx,dy)<d;}
document.querySelectorAll('.sprite[data-w]').forEach(el=>{
  const svg=el.querySelector('svg'); let r={w:100,h:100};
  if(svg&&svg.viewBox&&svg.viewBox.baseVal){r={w:svg.viewBox.baseVal.width,h:svg.viewBox.baseVal.height};}
  el._ratio=r.h/r.w;
});
function layout(){
  document.querySelectorAll('.sprite[data-w]').forEach(el=>{
    if(el._x===undefined)return;
    const w=parseFloat(el.dataset.w),[px,py]=toPx(el._x,el._y),sz=w*S;
    el.style.width=sz+'px'; el.style.height=(sz*el._ratio)+'px';
    el.style.left=(px-sz/2)+'px'; el.style.top=(py-sz*el._ratio/2)+'px';
  });
}
function particle(txt,x,y,color,size){
  const[px,py]=toPx(x,y);const s=document.createElement('div');
  s.className='particle';s.textContent=txt;
  s.style.cssText=`left:${px}px;top:${py}px;color:${color||'#F0504D'};font-size:${(size||26)*S/5.2}px;transform:translate(-50%,-50%)`;
  game.appendChild(s);
  s.animate([{transform:'translate(-50%,-50%) translateY(0) scale(1)',opacity:1},
    {transform:'translate(-50%,-50%) translateY(-70px) scale(1.3)',opacity:0}],{duration:1100,easing:'ease-out'});
  setTimeout(()=>s.remove(),1150);
}
function hearts(x,y){['#F0504D','#FF8A87','#F0504D'].forEach((c,i)=>setTimeout(()=>particle('\u2665',x+(Math.random()*10-5),y-4,'#F0504D',22),i*160));}
function sparkles(x,y,n){
  const colors=['#FFC93C','#8E7CF0','#3FB6B2','#FF8A87'];
  for(let i=0;i<(n||10);i++){
    const[px,py]=toPx(x,y);const s=document.createElement('div');s.className='sparkle';
    const sz=(8+Math.random()*10);
    s.style.cssText=`left:${px}px;top:${py}px;width:${sz}px;height:${sz}px;background:${colors[i%colors.length]};border-radius:${Math.random()>.5?'50%':'2px'};--dx:${(Math.random()*80-40)}px;--dy:${(Math.random()*80-40)}px`;
    game.appendChild(s);setTimeout(()=>s.remove(),1150);
  }
}
let AC=null,muted=window.NK?!NK.sound:false;
function wakeAudio(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){}}
function tone(f,dur,type,vol,when,slideTo){
  if(muted)return;wakeAudio();if(!AC)return;
  try{
    const t=AC.currentTime+(when||0),o=AC.createOscillator(),g=AC.createGain();
    o.type=type||'sine';o.frequency.setValueAtTime(f,t);
    if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,t+dur);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||.2,t+.02);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur+.05);
  }catch(e){}
}
const sClick=()=>tone(700,.08,'triangle',.15);
const sPop=()=>tone(500,.12,'sine',.22,0,900);
const sMeow=()=>{tone(620,.28,'sawtooth',.10,0,920);tone(930,.22,'sawtooth',.07,.12,640);};
const sHappy=()=>{[523,659,784].forEach((f,i)=>tone(f,.16,'triangle',.16,i*.09));};
const sMunch=()=>{for(let i=0;i<3;i++)tone(180+Math.random()*120,.09,'square',.10,i*.13);};
const sThud=()=>tone(140,.14,'sine',.2,0,70);
const sDrip=()=>tone(1200,.06,'sine',.10,0,700);
const sBark=()=>{tone(380,.12,'square',.16);tone(340,.14,'square',.16,.16);};
const sChirp=()=>{tone(2400,.09,'sine',.12);tone(2900,.09,'sine',.12,.11);};
const sGrow=()=>{[392,494,587,784].forEach((f,i)=>tone(f,.13,'sine',.13,i*.08));};
const sGiggle=()=>{[660,760,880,990].forEach((f,i)=>tone(f,.1,'sine',.13,i*.07));};
window.ParkYard={game,measure,place,toPx,toUnits,near,layout,particle,hearts,sparkles,
  tone,sClick,sPop,sMeow,sHappy,sMunch,sThud,sDrip,sBark,sChirp,sGrow,sGiggle,wakeAudio,
  get muted(){return muted;},set muted(v){muted=v;}};
})();
</script>

<script>
(function(){
"use strict";
const B=window.ParkYard;
const {game,place,near,layout}=B;
const $=id=>document.getElementById(id);
const nicko=$('nicko'),tree=$('tree'),bed=$('bed'),can=$('can'),swingset=$('swingset'),
  beachball=$('beachball'),doghouse=$('doghouse'),butterfly=$('butterfly'),door=$('door'),
  sun=$('sun'),rainbow=$('rainbow');
const apples=[$('apple1'),$('apple2'),$('apple3')];
const appleHome={apple1:[16,62],apple2:[26,58],apple3:[30,68]};
const flowers=[$('f0'),$('f1'),$('f2'),$('f3')];
flowers.forEach(f=>{f._stage=0;});

/* ---------- Nicko face ---------- */
function setFace(m){
  nicko.querySelector('.eyesOpen').style.display=m==='open'?'':'none';
  nicko.querySelector('.eyesClosed').style.display=m==='closed'?'':'none';
}
function setMouth(happy){
  nicko.querySelector('.mouthSmile').style.display=happy?'none':'';
  nicko.querySelector('.mouthHappy').style.display=happy?'':'none';
}
function happyHop(withHearts){
  if(nicko._onSwing)return;
  nicko.classList.remove('happyjump');void nicko.offsetWidth;nicko.classList.add('happyjump');
  setMouth(true);setTimeout(()=>setMouth(false),900);
  B.sHappy();if(withHearts!==false)B.hearts(nicko._x,nicko._y-10);
}
setInterval(()=>{
  if(!nicko.classList.contains('walking')){
    nicko.classList.add('blink');setTimeout(()=>nicko.classList.remove('blink'),150);
  }
},3400);

/* ---------- drag & tap engine ---------- */
function interact(el,{drag=true,lift=true,onTap,onDrop}={}){
  let sx,sy,ox,oy,moved,pid;
  el.addEventListener('pointerdown',e=>{
    if(pid!=null)return; // A second finger must not steal this drag.
    e.preventDefault();e.stopPropagation();B.wakeAudio();
    pid=e.pointerId;sx=e.clientX;sy=e.clientY;ox=el._x;oy=el._y;moved=false;
    try{el.setPointerCapture(pid);}catch(err){}
    if(lift)el.classList.add('lift');
    if(el===nicko)nicko.classList.add('walking');
  });
  el.addEventListener('pointermove',e=>{
    if(e.pointerId!==pid||!drag)return;
    const[ux,uy]=B.toUnits(e.clientX,e.clientY),[oux,ouy]=B.toUnits(sx,sy);
    if(Math.hypot(ux-oux,uy-ouy)>.8)moved=true;
    if(!moved)return;
    const w=parseFloat(el.dataset.w);
    place(el,Math.min(96,Math.max(4,ox+(ux-oux))),Math.min(152,Math.max(14,oy+(uy-ouy))),w);
  });
  const up=e=>{
    if(e.pointerId!==pid)return;pid=null;
    el.classList.remove('lift');nicko.classList.remove('walking');
    if(e.type==='pointercancel')return; // Cancellation is not a completed action.
    if(!moved&&onTap)onTap();
    else if(moved&&onDrop)onDrop();
  };
  el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
}

/* ---------- flowers ---------- */
function renderFlower(f){
  const stages=[f.querySelector('.st1'),f.querySelector('.st2'),f.querySelector('.st3')];
  stages.forEach((s,i)=>{if(s)s.style.display=(f._stage===i+1)?'':'none';});
}
function saveFlowers(){if(window.NK)NK.session.set('flowers',flowers.map(function(f){return f._stage;}));}
function waterFlowers(){
  let grew=false;
  flowers.forEach(f=>{
    if(f._stage<3){f._stage++;renderFlower(f);grew=true;
      setTimeout(()=>B.sparkles(f._x,f._y-8,5),Math.random()*400);}
  });
  if(grew){B.sGrow();saveFlowers();}
  if(flowers.every(f=>f._stage===3)){
    setTimeout(()=>{B.sHappy();B.hearts(bed._x,bed._y-10);},700);
  }
}
flowers.forEach(f=>{
  interact(f,{drag:false,onTap(){
    if(f._stage===0){f._stage=1;renderFlower(f);saveFlowers();B.sPop();B.sparkles(f._x,f._y-6,5);}
    else{B.sClick();}
  }});
});
interact(bed,{drag:false,onTap(){
  const f=flowers.find(x=>x._stage===0);
  if(f){f._stage=1;renderFlower(f);saveFlowers();B.sPop();B.sparkles(f._x,f._y-6,5);}
  else B.sClick();
}});

/* ---------- watering can ---------- */
interact(can,{onTap(){B.sPop();},onDrop(){
  if(near(can,bed,18)){
    can.classList.add('tilt');
    for(let i=0;i<8;i++)setTimeout(()=>{B.sDrip();B.sparkles(bed._x+(Math.random()*24-12),bed._y-6,3);},i*160);
    setTimeout(()=>{waterFlowers();},500);
    setTimeout(()=>can.classList.remove('tilt'),1400);
  }
}});

/* ---------- sun, clouds, rainbow ---------- */
interact(sun,{drag:false,onTap(){
  B.sparkles(sun._x,sun._y,12);
  [523,659,784,1047].forEach((f,i)=>B.tone(f,.14,'triangle',.12,i*.08));
}});
let raining=false;
function rain(){
  if(raining)return;raining=true;
  for(let i=0;i<8;i++)setTimeout(()=>{B.sDrip();B.sparkles(50+(Math.random()*50-25),60,3);},i*280);
  setTimeout(()=>{waterFlowers();},1200);
  rainbow.style.opacity='1';B.sGrow();
  setTimeout(()=>{rainbow.style.opacity='0';raining=false;},4500);
}
interact($('cloud1'),{drag:false,onTap:rain});
interact($('cloud2'),{drag:false,onTap:rain});

/* ---------- apple tree ---------- */
function fallApple(a){
  if(!a._onTree)return;a._onTree=false;
  place(a,a._x+(Math.random()*10-5),128,6,true);B.sThud();
}
interact(tree,{drag:false,onTap(){
  tree.classList.remove('wobble');void tree.offsetWidth;tree.classList.add('wobble');
  const a=apples.find(x=>x._onTree);if(a)fallApple(a);else B.sPop();
}});
apples.forEach(a=>{
  a._onTree=true;
  interact(a,{onTap(){
    if(a._onTree)fallApple(a);else B.sPop();
  },onDrop(){
    if(!a._onTree&&near(a,nicko,10)){
      a.style.display='none';B.sMunch();B.hearts(nicko._x,nicko._y-10);happyHop(false);
      setTimeout(()=>{
        const[hx,hy]=appleHome[a.id];a._onTree=true;a.style.display='';
        place(a,hx,hy,6);B.sPop();
      },5000);
    }
  }});
});

/* ---------- beach ball ---------- */
interact(beachball,{onTap(){
  B.sPop();
  place(beachball,beachball._x,beachball._y-6,10,true);
  setTimeout(()=>place(beachball,beachball._x,beachball._y+6,10,true),220);
},onDrop(){
  B.tone(200,.2,'sine',.14,0,500);
  place(beachball,beachball._x,beachball._y-8,10,true);
  setTimeout(()=>place(beachball,beachball._x,beachball._y+8,10,true),240);
}});

/* ---------- swing ---------- */
function swingGo(){
  const arm=$('swingArm');
  arm.classList.remove('swinging');void arm.getBoundingClientRect();arm.classList.add('swinging');
}
interact(swingset,{drag:false,onTap(){swingGo();B.sGiggle();}});
function rideSwing(){
  nicko._onSwing=true;
  place(nicko,78,80,14,true);swingGo();B.sGiggle();
  B.sparkles(nicko._x,nicko._y-12,10);
}

/* ---------- doghouse (mystery dog!) ---------- */
let dogOut=false;
interact(doghouse,{drag:false,onTap(){
  dogOut=!dogOut;
  $('dog').classList.toggle('out',dogOut);
  if(dogOut){B.sBark();setTimeout(()=>happyHop(false),400);}
  else B.sClick();
}});

/* ---------- butterfly ---------- */
let bt=0;
setInterval(()=>{
  bt+=0.12;
  const allBloom=flowers.every(f=>f._stage===3);
  const cx=allBloom?58:50,cy=allBloom?104:52,rx=allBloom?14:32,ry=allBloom?8:16;
  place(butterfly,cx+rx*Math.sin(bt*0.7),cy+ry*Math.cos(bt*1.1),8);
},120);
interact(butterfly,{onTap(){
  B.sChirp();B.sparkles(butterfly._x,butterfly._y-4,6);
},onDrop(){}});

/* ---------- garden gate to playroom ---------- */
interact(door,{drag:false,onTap(){B.sPop();setTimeout(()=>{window.location.href='../playroom/';},250);}});

/* ---------- Nicko ---------- */
interact(nicko,{onTap(){
  if(nicko._onSwing){nicko._onSwing=false;place(nicko,58,120,19,true);B.sMeow();return;}
  B.sMeow();happyHop(false);
},onDrop(){
  if(near(nicko,swingset,13)&&!nicko._onSwing){rideSwing();return;}
  if(near(nicko,doghouse,16)){ // greeting the mystery dog: a social hello
    if(!dogOut){dogOut=true;$('dog').classList.toggle('out',true);}
    B.sBark();setMouth(true);
    setTimeout(()=>{setMouth(false);B.sMeow();B.hearts(doghouse._x,doghouse._y-12);happyHop(false);},450);
    return;
  }
  if(near(nicko,butterfly,15)){ // Nicko watches the butterfly
    B.sChirp();B.sparkles(butterfly._x,butterfly._y-6,8);
    setMouth(true);setTimeout(()=>setMouth(false),1200);
    return;
  }
}});

/* ---------- butterfly cue: Nicko notices it on his own ---------- */
let lastActB=0;
game.addEventListener('pointerdown',()=>{lastActB=Date.now();},true);
setInterval(()=>{
  if(nicko._onSwing||nicko.classList.contains('walking')||Date.now()-lastActB<20000)return;
  if(Math.random()<.5&&!near(nicko,butterfly,20)){
    nicko.classList.add('walking');
    const dx=butterfly._x-nicko._x,dy=butterfly._y-nicko._y,d=Math.hypot(dx,dy)||1;
    place(nicko,nicko._x+dx/d*10,nicko._y+dy/d*10,19,true);
    B.sChirp();
    setTimeout(()=>nicko.classList.remove('walking'),600);
  }
},30000);
$('bg').addEventListener('pointerdown',e=>{
  if(nicko._onSwing)return;
  B.wakeAudio();
  const r=game.getBoundingClientRect();
  const[ux,uy]=B.toUnits(e.clientX-r.left,e.clientY-r.top);
  if(ux<0||ux>100||uy<0||uy>160)return;
  nicko.classList.add('walking');
  place(nicko,Math.min(94,Math.max(6,ux)),Math.min(150,Math.max(60,uy)),19,true);
  B.tone(300,.18,'sine',.08,0,520);
  setTimeout(()=>nicko.classList.remove('walking'),650);
});

/* ---------- HUD ---------- */
$('soundBtn').addEventListener('pointerdown',e=>{
  e.stopPropagation();B.wakeAudio();B.muted=!B.muted;if(window.NK)NK.sound=!B.muted;
  $('sndOn').style.display=B.muted?'none':'';$('sndOff').style.display=B.muted?'':'none';
  if(!B.muted)B.sPop();
});
$('hud').addEventListener('pointerdown',e=>e.stopPropagation());
$('resetBtn').addEventListener('pointerdown',e=>{e.stopPropagation();window.location.reload();});

/* ---------- init ---------- */
function init(){
  B.measure();
  place(sun,14,22,14);place($('cloud1'),42,18,16);place($('cloud2'),68,28,14);
  place(rainbow,50,34,44);
  place(tree,22,68,30);
  place($('apple1'),16,62,6);place($('apple2'),26,58,6);place($('apple3'),30,68,6);
  place(bed,58,120,34);
  place($('f0'),48,112,7);place($('f1'),55,110,7);place($('f2'),62,112,7);place($('f3'),69,110,7);
  if(window.NK){var _fs=NK.session.get('flowers');if(_fs)flowers.forEach(function(f,i){f._stage=_fs[i]||0;});}
  flowers.forEach(renderFlower);
  place(can,36,134,12);
  place(swingset,78,78,26);
  place(beachball,32,142,10);
  place(doghouse,86,130,20);
  place(butterfly,50,60,8);
  place(door,50,98,12);place(nicko,46,140,19);
  B.layout();
  if(window.NK){NK.room='backyard';if(!NK.sound){B.muted=true;$('sndOn').style.display='none';$('sndOff').style.display='';}}
  setTimeout(()=>{B.sMeow();happyHop(false);},1200);
}
window.addEventListener('resize',()=>{B.measure();B.layout();});
window.addEventListener('orientationchange',()=>setTimeout(()=>{B.measure();B.layout();},300));
init();
})();
</script>
