<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Nicko's Kitchen</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#FDF3E3;font-family:system-ui,sans-serif;
    user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none}
  #game{position:fixed;inset:0;overflow:hidden}
  #bg{position:absolute;inset:0;z-index:0;background:linear-gradient(to bottom,#FDF3E3 0%,#FDF3E3 70%,#E8B57E 70%,#E8B57E 100%)}
  .sprite{position:absolute;z-index:10;touch-action:none;cursor:pointer}
  .sprite svg{width:100%;height:100%;display:block;overflow:visible;pointer-events:none}
  .sprite.lift{z-index:40;filter:drop-shadow(0 10px 10px rgba(0,0,0,.25))}
  .particle{position:absolute;z-index:45;pointer-events:none;font-weight:800}
  .sparkle{position:absolute;z-index:45;pointer-events:none;animation:spark 1.1s ease-out forwards}
  @keyframes spark{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
  .note{position:absolute;z-index:45;pointer-events:none;font-size:22px;animation:floatUp 2.4s ease-out forwards}
  @keyframes floatUp{0%{transform:translateY(0) rotate(-8deg);opacity:0}15%{opacity:1}100%{transform:translateY(-90px) rotate(10deg);opacity:0}}
  .steam{position:absolute;z-index:20;pointer-events:none;border-radius:50%;background:rgba(255,255,255,.75);animation:steamUp 1.8s ease-out forwards}
  @keyframes steamUp{0%{transform:translateY(0) scale(.5);opacity:0}25%{opacity:.9}100%{transform:translateY(-60px) scale(1.4);opacity:0}}
  .drop{position:absolute;z-index:20;pointer-events:none;border-radius:50%;background:#5EB9F0;animation:dropFall .5s ease-in forwards}
  @keyframes dropFall{from{transform:translateY(-4px);opacity:1}to{transform:translateY(16px);opacity:0}}
  #hud{position:absolute;top:calc(10px + env(safe-area-inset-top));right:12px;z-index:50;display:flex;gap:10px}
  .hbtn{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.92);border:2.5px solid #2E2A26;
    display:flex;align-items:center;justify-content:center;box-shadow:2px 2px 0 rgba(46,42,38,.35);cursor:pointer}
  .hbtn:active{transform:scale(.92)}
  .hbtn svg{width:24px;height:24px}
  #fridgeDoor{transition:transform .7s ease;z-index:12}
  #fridgeDoor.open{transform:translateX(82%)}
  .foodhidden{display:none!important}
  #waterStream{position:absolute;z-index:19;pointer-events:none;background:linear-gradient(#7FD0F7,#5EB9F0);
    border-radius:4px;opacity:0;transition:opacity .3s}
  #waterStream.on{opacity:.9;animation:stream .4s linear infinite}
  @keyframes stream{from{background-position:0 0}to{background-position:0 12px}}
  #burnerGlow{position:absolute;z-index:9;pointer-events:none;border-radius:50%;
    background:radial-gradient(circle,rgba(255,110,60,.9),rgba(255,110,60,0) 70%);opacity:0;transition:opacity .5s}
  .cupwater{position:absolute;left:18%;right:18%;bottom:14%;background:#5EB9F0;border-radius:0 0 6px 6px;pointer-events:none;transition:height .4s}
  #nicko .eyesOpen{transform-box:fill-box;transform-origin:center}
  #nicko.blink .eyesOpen{transform:scaleY(.12)}
  #nicko .tail{transform-box:fill-box;transform-origin:left center;animation:wag 2.6s ease-in-out infinite}
  @keyframes wag{0%,100%{transform:rotate(0)}50%{transform:rotate(24deg)}}
  #nicko .breathe{transform-box:fill-box;transform-origin:center;animation:breath 3s ease-in-out infinite}
  @keyframes breath{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}
  #nicko.walking .breathe{animation:bob .32s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6%)}}
  #nicko.happyjump{animation:hjump .55s ease}
  @keyframes hjump{0%{transform:translateY(0) scale(1)}35%{transform:translateY(-16%) scale(1.04,.94)}70%{transform:translateY(0) scale(.96,1.05)}100%{transform:translateY(0) scale(1)}}
  #nicko.shiver{animation:shiver .12s linear infinite}
  @keyframes shiver{0%{transform:translateX(-3%)}100%{transform:translateX(3%)}}
  #nicko.shake{animation:nshake .5s ease}
  @keyframes nshake{0%,100%{transform:rotate(0)}25%{transform:rotate(-9deg)}50%{transform:rotate(8deg)}75%{transform:rotate(-5deg)}}
  #nicko.sour .breathe{animation:ssour .4s ease}
  @keyframes ssour{0%,100%{transform:translateX(0) scale(1)}25%{transform:translateX(-5%) scale(.96)}75%{transform:translateX(5%) scale(.96)}}
</style>
</head>

<script src="../shared.js"></script>
<script>
(function(){
"use strict";
const game=document.getElementById('game');
let S=1,OX=0,OY=0;
function measure(){
  const w=game.clientWidth,h=game.clientHeight;
  S=Math.min(w/100,h/160); OX=(w-100*S)/2; OY=(h-160*S)/2;
}
const toPx=(x,y)=>[OX+x*S,OY+y*S];
const toUnits=(px,py)=>[(px-OX)/S,(py-OY)/S];
function place(el,x,y,w,animate){
  const[px,py]=toPx(x,y); el._x=x; el._y=y;
  const sz=w*S;
  el.style.width=sz+'px'; el.style.height='auto';
  el.style.transition=animate?'left .6s ease,top .6s ease':'';
  el.style.left=(px-sz/2)+'px'; el.style.top=(py-sz/2)+'px';
}
function near(a,b,d){const dx=(a._x||0)-(b._x||0),dy=(a._y||0)-(b._y||0);return Math.hypot(dx,dy)<d;}
document.querySelectorAll('.sprite[data-w]').forEach(el=>{
  const svg=el.querySelector('svg'); let r={w:100,h:100};
  if(svg&&svg.viewBox&&svg.viewBox.baseVal){r={w:svg.viewBox.baseVal.width,h:svg.viewBox.baseVal.height};}
  el._ratio=r.h/r.w;
});
function layout(){
  document.querySelectorAll('.sprite[data-w]').forEach(el=>{
    if(el._x===undefined)return;
    const w=parseFloat(el.dataset.w),[px,py]=toPx(el._x,el._y),sz=w*S;
    el.style.width=sz+'px'; el.style.height=(sz*el._ratio)+'px';
    el.style.left=(px-sz/2)+'px'; el.style.top=(py-sz*el._ratio/2)+'px';
  });
  const ws=document.getElementById('waterStream'),fc=document.getElementById('faucet');
  if(ws&&fc._x!==undefined){const[fx,fy]=toPx(fc._x+3.5,fc._y-1);const wdt=4*S;
    ws.style.width=wdt+'px';ws.style.left=(fx-wdt/2)+'px';ws.style.top=fy+'px';ws.style.height=(14*S)+'px';}
  const bg=document.getElementById('burnerGlow'),pt=document.getElementById('pot');
  if(bg&&pt._x!==undefined){const[bx,by]=toPx(pt._x,pt._y+4);const s=20*S;
    bg.style.width=s+'px';bg.style.height=s+'px';bg.style.left=(bx-s/2)+'px';bg.style.top=(by-s/2)+'px';}
}
function particle(txt,x,y,color,size){
  const[px,py]=toPx(x,y);const s=document.createElement('div');
  s.className='particle';s.textContent=txt;
  s.style.cssText=`left:${px}px;top:${py}px;color:${color||'#F0504D'};font-size:${(size||26)*S/5.2}px;transform:translate(-50%,-50%)`;
  game.appendChild(s);
  s.animate([{transform:'translate(-50%,-50%) translateY(0) scale(1)',opacity:1},
    {transform:'translate(-50%,-50%) translateY(-70px) scale(1.3)',opacity:0}],{duration:1100,easing:'ease-out'});
  setTimeout(()=>s.remove(),1150);
}
function hearts(x,y){['#F0504D','#FF8A87','#F0504D'].forEach((c,i)=>setTimeout(()=>particle('\u2665',x+(Math.random()*10-5),y-4,'#F0504D',22),i*160));}
function sparkles(x,y,n){
  const colors=['#FFC93C','#8E7CF0','#3FB6B2','#FF8A87'];
  for(let i=0;i<(n||10);i++){
    const[px,py]=toPx(x,y);const s=document.createElement('div');s.className='sparkle';
    const sz=(8+Math.random()*10);
    s.style.cssText=`left:${px}px;top:${py}px;width:${sz}px;height:${sz}px;background:${colors[i%colors.length]};border-radius:${Math.random()>.5?'50%':'2px'};--dx:${(Math.random()*80-40)}px;--dy:${(Math.random()*80-40)}px`;
    game.appendChild(s);setTimeout(()=>s.remove(),1150);
  }
}
function steam(x,y){
  const[px,py]=toPx(x+(Math.random()*10-5),y);const s=document.createElement('div');s.className='steam';
  const sz=14+Math.random()*10;s.style.cssText=`left:${px}px;top:${py}px;width:${sz}px;height:${sz}px`;
  game.appendChild(s);setTimeout(()=>s.remove(),1850);
}
function droplets(x,y,n){
  for(let i=0;i<(n||6);i++){
    const[px,py]=toPx(x+(Math.random()*8-4),y);const s=document.createElement('div');s.className='drop';
    const sz=6+Math.random()*6;s.style.cssText=`left:${px}px;top:${py}px;width:${sz}px;height:${sz}px`;
    game.appendChild(s);setTimeout(()=>s.remove(),550);
  }
}
let AC=null,muted=window.NK?!NK.sound:false;
function wakeAudio(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){}}
function tone(f,dur,type,vol,when,slideTo){
  if(muted)return;wakeAudio();if(!AC)return;
  try{
    const t=AC.currentTime+(when||0),o=AC.createOscillator(),g=AC.createGain();
    o.type=type||'sine';o.frequency.setValueAtTime(f,t);
    if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,t+dur);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||.2,t+.02);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur+.05);
  }catch(e){}
}
const sClick=()=>tone(700,.08,'triangle',.15);
const sPop=()=>tone(500,.12,'sine',.22,0,900);
const sMeow=()=>{tone(620,.28,'sawtooth',.10,0,920);tone(930,.22,'sawtooth',.07,.12,640);};
const sHappy=()=>{[523,659,784].forEach((f,i)=>tone(f,.16,'triangle',.16,i*.09));};
const sMunch=()=>{for(let i=0;i<3;i++)tone(180+Math.random()*120,.09,'square',.10,i*.13);};
const sBubble=()=>tone(300+Math.random()*300,.12,'sine',.08,0,150);
const sSplash=()=>{tone(900,.2,'sine',.12,0,300);tone(500,.25,'triangle',.08,.08,200);};
const sBrr=()=>{for(let i=0;i<5;i++)tone(220,.1,'sawtooth',.07,i*.1,180+((i%2)*60));};
const sSour=()=>{tone(600,.15,'square',.09,0,300);tone(400,.2,'square',.09,.14,200);};
window.ParkKitchen={game,measure,place,toPx,toUnits,near,layout,particle,hearts,sparkles,steam,droplets,
  tone,sClick,sPop,sMeow,sHappy,sMunch,sBubble,sSplash,sBrr,sSour,wakeAudio,
  get muted(){return muted;},set muted(v){muted=v;}};
})();
</script>

<script>
(function(){
"use strict";
const B=window.ParkKitchen;
const {game,place,near,layout}=B;
const $=id=>document.getElementById(id);
const nicko=$('nicko'),fridge=$('fridge'),fridgeDoor=$('fridgeDoor'),
  stove=$('stove'),pot=$('pot'),sink=$('sink'),faucet=$('faucet'),
  stream=$('waterStream'),glow=$('burnerGlow'),bowl=$('bowl'),
  cup=$('cup'),cupWater=$('cupWater'),door=$('door'),cabinet=$('cabinet');
const foods=[$('foodFish'),$('foodApple'),$('foodMilk'),$('foodLemon')];
const homePos={foodFish:[15,100],foodApple:[25,100],foodMilk:[15,113],foodLemon:[25,113]};
foods.forEach(f=>{f._home=true;f._eaten=false;f._inBowl=false;});
let bowlContents=[],fridgeOpen=false;

/* ---------- Nicko face ---------- */
function setFace(m){
  nicko.querySelector('.eyesOpen').style.display=m==='open'?'':'none';
  nicko.querySelector('.eyesClosed').style.display=m==='closed'?'':'none';
  nicko.querySelector('.eyesHalf').style.display=m==='half'?'':'none';
}
function setMouth(happy){
  nicko.querySelector('.mouthSmile').style.display=happy?'none':'';
  nicko.querySelector('.mouthHappy').style.display=happy?'':'none';
}
function happyHop(withHearts){
  nicko.classList.remove('happyjump');void nicko.offsetWidth;nicko.classList.add('happyjump');
  setMouth(true);setTimeout(()=>setMouth(false),900);
  B.sHappy();if(withHearts!==false)B.hearts(nicko._x,nicko._y-10);
}
setInterval(()=>{
  if(!nicko.classList.contains('walking')){
    nicko.classList.add('blink');setTimeout(()=>nicko.classList.remove('blink'),150);
  }
},3400);

/* ---------- drag & tap engine ---------- */
function interact(el,{drag=true,lift=true,onTap,onDrop}={}){
  let sx,sy,ox,oy,moved,pid;
  el.addEventListener('pointerdown',e=>{
    e.preventDefault();e.stopPropagation();B.wakeAudio();
    pid=e.pointerId;sx=e.clientX;sy=e.clientY;ox=el._x;oy=el._y;moved=false;
    try{el.setPointerCapture(pid);}catch(err){}
    if(lift)el.classList.add('lift');
    if(el===nicko)nicko.classList.add('walking');
  });
  el.addEventListener('pointermove',e=>{
    if(e.pointerId!==pid||!drag)return;
    const[ux,uy]=B.toUnits(e.clientX,e.clientY),[oux,ouy]=B.toUnits(sx,sy);
    if(Math.hypot(ux-oux,uy-ouy)>.8)moved=true;
    if(!moved)return;
    const w=parseFloat(el.dataset.w);
    place(el,Math.min(96,Math.max(4,ox+(ux-oux))),Math.min(152,Math.max(14,oy+(uy-ouy))),w);
  });
  const up=e=>{
    if(e.pointerId!==pid)return;pid=null;
    el.classList.remove('lift');nicko.classList.remove('walking');
    if(!moved&&onTap)onTap();
    else if(moved&&onDrop)onDrop();
  };
  el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
}

/* ---------- fridge ---------- */
function updateFoodVis(){
  foods.forEach(f=>f.classList.toggle('foodhidden',f._eaten||(f._home&&!fridgeOpen&&!f._inBowl)));
}
function toggleFridge(){
  fridgeOpen=!fridgeOpen;B.sClick();
  fridgeDoor.classList.toggle('open',fridgeOpen);
  updateFoodVis();
  if(fridgeOpen)B.sparkles(20,100,6);
}
interact(fridge,{drag:false,onTap:toggleFridge});
interact(fridgeDoor,{drag:false,onTap:toggleFridge});

/* ---------- foods ---------- */
function respawnFood(f){
  const[hx,hy]=homePos[f.id];f._eaten=false;f._home=true;f._inBowl=false;
  place(f,hx,hy,parseFloat(f.dataset.w));updateFoodVis();
}
function sourFace(){
  B.sSour();setFace('half');nicko.classList.add('sour');
  B.sparkles(nicko._x,nicko._y-10,8);
  setTimeout(()=>{setFace('open');nicko.classList.remove('sour');B.sMeow();},1200);
  setTimeout(()=>respawnFood($('foodLemon')),3500);
}
function feedFood(f){
  f._eaten=true;f._inBowl=false;
  const idx=bowlContents.indexOf(f);if(idx>=0)bowlContents.splice(idx,1);
  updateFoodVis();
  if(f.id==='foodLemon'){sourFace();return;}
  B.sMunch();
  if(f.id==='foodFish'){B.hearts(nicko._x,nicko._y-10);happyHop(true);} // favorite: genuine affection
  else if(f.id==='foodMilk'){B.hearts(nicko._x,nicko._y-10);setMouth(true);setTimeout(()=>setMouth(false),900);} // gentle
  else{happyHop(false);B.sparkles(nicko._x,nicko._y-10,10);} // apple: playful crunch
  setTimeout(()=>respawnFood(f),3500);
}
/* ---------- soup: foods dropped in a hot pot ---------- */
const soupTint={foodFish:'#F5A623',foodApple:'#E0663A',foodMilk:'#F3EAD8',foodLemon:'#F2D24B'};
function makeSoup(f){
  f._eaten=true;f._home=false;updateFoodVis();
  const surf=$('soupSurf');if(surf)surf.setAttribute('fill',soupTint[f.id]||'#F5A623');
  B.sBubble();B.tone(200,.4,'sawtooth',.05,0,110); // sizzle
  for(let i=0;i<5;i++)setTimeout(()=>B.steam(pot._x,pot._y-9),i*130);
  B.sparkles(pot._x,pot._y-12,10);
  setTimeout(()=>respawnFood(f),6000);
}
foods.forEach(f=>{
  interact(f,{onTap(){B.sPop();},onDrop(){
    f._inBowl=false;
    const[hx,hy]=homePos[f.id];
    if(fridgeOpen&&Math.hypot(f._x-20,f._y-110)<16){
      place(f,hx,hy,parseFloat(f.dataset.w));f._home=true;updateFoodVis();return;
    }
    f._home=false;
    if(near(f,pot,12)&&burnerOn){makeSoup(f);return;} // hot pot + food = soup
    if(near(f,nicko,11)){feedFood(f);return;}
    if(near(f,bowl,11)&&bowlContents.length<4){
      bowlContents.push(f);f._inBowl=true;
      place(f,bowl._x+(bowlContents.length%2?2.5:-2.5),bowl._y-2-bowlContents.length*1.6,parseFloat(f.dataset.w));
      B.sPop();updateFoodVis();return;
    }
    updateFoodVis();
  }});
});

/* ---------- bowl: serve the meal ---------- */
interact(bowl,{drag:false,onTap(){
  if(!bowlContents.length){B.sClick();return;}
  place(nicko,65,124,19,true);nicko.classList.add('walking');
  setTimeout(()=>nicko.classList.remove('walking'),650);
  const items=[...bowlContents];bowlContents=[];
  items.forEach((f,i)=>setTimeout(()=>{
    f._eaten=true;f._inBowl=false;updateFoodVis();B.sMunch();
    B.hearts(bowl._x,bowl._y-8);
    setTimeout(()=>respawnFood(f),3000);
  },i*550));
  setTimeout(()=>{B.sHappy();happyHop(false);B.sparkles(bowl._x,bowl._y-10,10);},items.length*550);
}});

/* ---------- stove & pot ---------- */
let burnerOn=false,burnT=null;
interact(stove,{drag:false,onTap(){
  burnerOn=!burnerOn;B.sClick();glow.style.opacity=burnerOn?'1':'0';
  if(burnerOn){burnT=setInterval(()=>{B.steam(pot._x,pot._y-9);if(Math.random()<.6)B.sBubble();},900);}
  else clearInterval(burnT);
}});
interact(pot,{drag:false,onTap(){
  if(burnerOn){for(let i=0;i<5;i++)setTimeout(()=>B.steam(pot._x,pot._y-9),i*120);B.sBubble();B.sPop();}
  else B.tone(220,.12,'triangle',.15);
}});

/* ---------- faucet, water, cup ---------- */
let waterOn=false,dropT=null,fillT=null,cupFill=0;
function stopFill(){if(fillT)clearInterval(fillT);fillT=null;}
interact(faucet,{drag:false,onTap(){
  waterOn=!waterOn;B.sSplash();stream.classList.toggle('on',waterOn);
  if(waterOn){
    dropT=setInterval(()=>B.droplets(85.5,104,3),650);
    stopFill();
    fillT=setInterval(()=>{
      if(!waterOn){stopFill();return;}
      if(Math.hypot(cup._x-85.5,cup._y-108)<9&&cupFill<100){
        cupFill=Math.min(100,cupFill+25);cupWater.style.height=cupFill+'%';
        if(cupFill>=100){B.sPop();B.sparkles(cup._x,cup._y-8,8);}
      }
    },450);
  }else{clearInterval(dropT);stopFill();}
}});
interact(cup,{onTap(){
  if(cupFill>0){cupFill=0;cupWater.style.height='0%';B.sSplash();B.droplets(cup._x,cup._y,8);}
  else B.sPop();
},onDrop(){
  if(cupFill>=75&&near(cup,nicko,12)){
    cupFill=0;cupWater.style.height='0%';
    B.tone(400,.15,'sine',.12,0,700);B.tone(500,.15,'sine',.12,.15,850);
    happyHop(false);B.sparkles(nicko._x,nicko._y-10,8);
  }
}});

/* ---------- cabinet & bedroom door ---------- */
interact(cabinet,{drag:false,onTap(){B.sPop();B.sparkles(cabinet._x,cabinet._y,6);}});
interact(door,{drag:false,onTap(){B.sPop();setTimeout(()=>{window.location.href='../bedroom/';},250);}});

/* ---------- Nicko ---------- */
let gagCool=0;
function gagOK(){const n=Date.now();if(n-gagCool<4000)return false;gagCool=n;return true;}
interact(nicko,{onTap(){B.sMeow();happyHop(false);},onDrop(){
  if(fridgeOpen&&near(nicko,{_x:20,_y:110},14)){
    if(!gagOK())return;
    place(nicko,20,112,14,true);nicko.classList.add('shiver');B.sBrr();
    B.particle('\u2744',20,100,'#7FB6D9',24);
    setTimeout(()=>{nicko.classList.remove('shiver');place(nicko,42,134,19,true);B.sMeow();},2200);
    return;
  }
  if(near(nicko,sink,13)){
    if(!gagOK())return;
    B.sSplash();B.droplets(nicko._x,nicko._y,14);nicko.classList.add('shake');
    setTimeout(()=>nicko.classList.remove('shake'),600);B.sMeow();
  }
  if(burnerOn&&near(nicko,stove,15)){ // hot stove: Nicko steps back on his own
    if(!gagOK())return;
    place(nicko,68,134,19,true);
    setFace('half');B.tone(330,.25,'sine',.1,0,220);
    nicko.classList.add('shake');
    setTimeout(()=>{nicko.classList.remove('shake');setFace('open');},900);
  }
}});

/* ---------- hunger: a gentle invitation, never a demand ---------- */
let lastActK=0;
game.addEventListener('pointerdown',()=>{lastActK=Date.now();},true);
setInterval(()=>{
  if(nicko.classList.contains('walking')||Date.now()-lastActK<30000)return;
  if(Math.random()<.5){
    B.tone(170,.55,'sine',.06,0,110); // tummy rumble
    nicko.classList.remove('happyjump');void nicko.offsetWidth;nicko.classList.add('happyjump');
  }
},45000);
$('bg').addEventListener('pointerdown',e=>{
  B.wakeAudio();
  const r=game.getBoundingClientRect();
  const[ux,uy]=B.toUnits(e.clientX-r.left,e.clientY-r.top);
  if(ux<0||ux>100||uy<0||uy>160)return;
  nicko.classList.add('walking');
  place(nicko,Math.min(94,Math.max(6,ux)),Math.min(150,Math.max(60,uy)),19,true);
  B.tone(300,.18,'sine',.08,0,520);
  setTimeout(()=>nicko.classList.remove('walking'),650);
});

/* ---------- HUD ---------- */
$('soundBtn').addEventListener('pointerdown',e=>{
  e.stopPropagation();B.wakeAudio();B.muted=!B.muted;if(window.NK)NK.sound=!B.muted;
  $('sndOn').style.display=B.muted?'none':'';$('sndOff').style.display=B.muted?'':'none';
  if(!B.muted)B.sPop();
});
$('hud').addEventListener('pointerdown',e=>e.stopPropagation());
$('resetBtn').addEventListener('pointerdown',e=>{e.stopPropagation();window.location.reload();});

/* ---------- init ---------- */
function init(){
  B.measure();
  place(fridge,20,110,26);place(fridgeDoor,20,110,26);
  place($('foodFish'),15,100,9);place($('foodApple'),25,100,8);
  place($('foodMilk'),15,113,8);place($('foodLemon'),25,113,8);
  place(stove,44,120,26);place(pot,44,108,16);
  place($('counter'),65,120,20);
  place(sink,84,120,24);place(faucet,82,103,10);
  place(bowl,65,110,14);place(cup,72,109,9);
  place(cabinet,60,56,30);place(door,92,72,13);
  place(nicko,42,134,19);
  B.layout();updateFoodVis();
  if(window.NK){NK.room='kitchen';if(!NK.sound){B.muted=true;$('sndOn').style.display='none';$('sndOff').style.display='';}}
  setTimeout(()=>{B.sMeow();happyHop(false);},1200);
}
window.addEventListener('resize',()=>{B.measure();B.layout();});
window.addEventListener('orientationchange',()=>setTimeout(()=>{B.measure();B.layout();},300));
init();
})();
</script>
</body>
</html>
