<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Nicko's Bathroom</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#DFF0F5;font-family:system-ui,sans-serif;
    user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none}
  #game{position:fixed;inset:0;overflow:hidden}
  #bg{position:absolute;inset:0;z-index:0;background:linear-gradient(to bottom,#DFF0F5 0%,#DFF0F5 70%,#BFE0EA 70%,#BFE0EA 100%)}
  .sprite{position:absolute;z-index:10;touch-action:none;cursor:pointer}
  .sprite svg{width:100%;height:100%;display:block;overflow:visible;pointer-events:none}
  .sprite.lift{z-index:40;filter:drop-shadow(0 10px 10px rgba(0,0,0,.25))}
  .particle{position:absolute;z-index:45;pointer-events:none;font-weight:800}
  .sparkle{position:absolute;z-index:45;pointer-events:none;animation:spark 1.1s ease-out forwards}
  @keyframes spark{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
  .bubble{position:absolute;z-index:44;pointer-events:none;border-radius:50%;
    background:radial-gradient(circle at 35% 35%,rgba(255,255,255,.95),rgba(191,227,242,.55));
    border:1.5px solid rgba(255,255,255,.9);animation:rise 2.4s ease-out forwards}
  @keyframes rise{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:1}100%{transform:translateY(-90px) scale(1.1);opacity:0}}
  #hud{position:absolute;top:calc(10px + env(safe-area-inset-top));right:12px;z-index:50;display:flex;gap:10px}
  .hbtn{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.92);border:2.5px solid #2E2A26;
    display:flex;align-items:center;justify-content:center;box-shadow:2px 2px 0 rgba(46,42,38,.35);cursor:pointer}
  .hbtn:active{transform:scale(.92)}
  .hbtn svg{width:24px;height:24px}
  #tLid{transform-box:fill-box;transform-origin:50% 90%;transition:transform .5s ease}
  #tLid.open{transform:rotateX(0) rotate(-70deg)}
  #flushSwirl{transform-box:fill-box;transform-origin:center}
  #flushSwirl.spin{animation:spin .8s ease-in-out}
  @keyframes spin{to{transform:rotate(360deg)}}
  .bob{animation:bob 1.6s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8%)}}
  #nicko .eyesOpen{transform-box:fill-box;transform-origin:center}
  #nicko.blink .eyesOpen{transform:scaleY(.12)}
  #nicko .tail{transform-box:fill-box;transform-origin:left center;animation:wag 2.6s ease-in-out infinite}
  @keyframes wag{0%,100%{transform:rotate(0)}50%{transform:rotate(24deg)}}
  #nicko .breathe{transform-box:fill-box;transform-origin:center;animation:breath 3s ease-in-out infinite}
  @keyframes breath{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}
  #nicko.walking .breathe{animation:bbob .32s ease-in-out infinite}
  @keyframes bbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6%)}}
  #nicko.happyjump{animation:hjump .55s ease}
  @keyframes hjump{0%{transform:translateY(0) scale(1)}35%{transform:translateY(-16%) scale(1.04,.94)}70%{transform:translateY(0) scale(.96,1.05)}100%{transform:translateY(0) scale(1)}}
  #nicko.shake{animation:shk .5s ease}
  @keyframes shk{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}50%{transform:rotate(7deg)}75%{transform:rotate(-5deg)}}
  #nicko.shiver{animation:shv .16s linear infinite}
  @keyframes shv{0%{transform:translateX(-2.5%)}100%{transform:translateX(2.5%)}}
</style>
</head>

<script src="../shared.js"></script>
<script>
(function(){
"use strict";
const game=document.getElementById('game');
let S=1,OX=0,OY=0;
function measure(){
  const w=game.clientWidth,h=game.clientHeight;
  S=Math.min(w/100,h/160); OX=(w-100*S)/2; OY=(h-160*S)/2;
}
const toPx=(x,y)=>[OX+x*S,OY+y*S];
const toUnits=(px,py)=>[(px-OX)/S,(py-OY)/S];
function place(el,x,y,w,animate){
  const[px,py]=toPx(x,y); el._x=x; el._y=y;
  const sz=w*S;
  el.style.width=sz+'px'; el.style.height='auto';
  el.style.transition=animate?'left .6s ease,top .6s ease':'';
  el.style.left=(px-sz/2)+'px'; el.style.top=(py-sz/2)+'px';
}
function near(a,b,d){const dx=(a._x||0)-(b._x||0),dy=(a._y||0)-(b._y||0);return Math.hypot(dx,dy)<d;}
document.querySelectorAll('.sprite[data-w]').forEach(el=>{
  const svg=el.querySelector('svg'); let r={w:100,h:100};
  if(svg&&svg.viewBox&&svg.viewBox.baseVal){r={w:svg.viewBox.baseVal.width,h:svg.viewBox.baseVal.height};}
  el._ratio=r.h/r.w;
});
function layout(){
  document.querySelectorAll('.sprite[data-w]').forEach(el=>{
    if(el._x===undefined)return;
    const w=parseFloat(el.dataset.w),[px,py]=toPx(el._x,el._y),sz=w*S;
    el.style.width=sz+'px'; el.style.height=(sz*el._ratio)+'px';
    el.style.left=(px-sz/2)+'px'; el.style.top=(py-sz*el._ratio/2)+'px';
  });
}
function particle(txt,x,y,color,size){
  const[px,py]=toPx(x,y);const s=document.createElement('div');
  s.className='particle';s.textContent=txt;
  s.style.cssText=`left:${px}px;top:${py}px;color:${color||'#7FD4E8'};font-size:${(size||26)*S/5.2}px;transform:translate(-50%,-50%)`;
  game.appendChild(s);
  s.animate([{transform:'translate(-50%,-50%) translateY(0) scale(1)',opacity:1},
    {transform:'translate(-50%,-50%) translateY(-70px) scale(1.3)',opacity:0}],{duration:1100,easing:'ease-out'});
  setTimeout(()=>s.remove(),1150);
}
function hearts(x,y){['#F0504D','#FF8A87','#F0504D'].forEach((c,i)=>setTimeout(()=>particle('\u2665',x+(Math.random()*10-5),y-4,'#F0504D',22),i*160));}
function sparkles(x,y,n){
  const colors=['#FFC93C','#8E7CF0','#7FD4E8','#FF8A87'];
  for(let i=0;i<(n||10);i++){
    const[px,py]=toPx(x,y);const s=document.createElement('div');s.className='sparkle';
    const sz=(8+Math.random()*10);
    s.style.cssText=`left:${px}px;top:${py}px;width:${sz}px;height:${sz}px;background:${colors[i%colors.length]};border-radius:${Math.random()>.5?'50%':'2px'};--dx:${(Math.random()*80-40)}px;--dy:${(Math.random()*80-40)}px`;
    game.appendChild(s);setTimeout(()=>s.remove(),1150);
  }
}
function bubble(x,y){
  const[px,py]=toPx(x,y);const s=document.createElement('div');s.className='bubble';
  const sz=(10+Math.random()*18);
  s.style.cssText=`left:${px-sz/2}px;top:${py-sz/2}px;width:${sz}px;height:${sz}px`;
  game.appendChild(s);setTimeout(()=>s.remove(),2450);
}
let AC=null,muted=window.NK?!NK.sound:false;
function wakeAudio(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){}}
function tone(f,dur,type,vol,when,slideTo){
  if(muted)return;wakeAudio();if(!AC)return;
  try{
    const t=AC.currentTime+(when||0),o=AC.createOscillator(),g=AC.createGain();
    o.type=type||'sine';o.frequency.setValueAtTime(f,t);
    if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,t+dur);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||.2,t+.02);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur+.05);
  }catch(e){}
}
const sClick=()=>tone(700,.08,'triangle',.15);
const sPop=()=>tone(500,.12,'sine',.22,0,900);
const sMeow=()=>{tone(620,.28,'sawtooth',.10,0,920);tone(930,.22,'sawtooth',.07,.12,640);};
const sHappy=()=>{[523,659,784].forEach((f,i)=>tone(f,.16,'triangle',.16,i*.09));};
const sSplash=()=>{for(let i=0;i<4;i++)tone(300+Math.random()*400,.1,'sine',.14,i*.09);};
const sSqueak=()=>tone(1400,.14,'sine',.16,0,2200);
const sWhoosh=()=>tone(900,.6,'sawtooth',.10,0,120);
const sDrip=()=>tone(1200,.06,'sine',.10,0,700);
window.ParkBath={game,measure,place,toPx,toUnits,near,layout,particle,hearts,sparkles,bubble,
  tone,sClick,sPop,sMeow,sHappy,sSplash,sSqueak,sWhoosh,sDrip,wakeAudio,
  get muted(){return muted;},set muted(v){muted=v;}};
})();
</script>

<script>
(function(){
"use strict";
const B=window.ParkBath;
const {game,place,near,layout}=B;
const $=id=>document.getElementById(id);
const nicko=$('nicko'),tub=$('tub'),toilet=$('toilet'),psink=$('psink'),mirror=$('mirror'),
  towel=$('towel'),duck=$('duck'),soap=$('soap'),door=$('door');
const towelHome=[8,80],soapHome=[82,86];

/* ---------- Nicko face ---------- */
function setFace(m){
  nicko.querySelector('.eyesOpen').style.display=m==='open'?'':'none';
  nicko.querySelector('.eyesClosed').style.display=m==='closed'?'':'none';
}
function setMouth(happy){
  nicko.querySelector('.mouthSmile').style.display=happy?'none':'';
  nicko.querySelector('.mouthHappy').style.display=happy?'':'none';
}
function happyHop(withHearts){
  if(nicko._inTub)return;
  nicko.classList.remove('happyjump');void nicko.offsetWidth;nicko.classList.add('happyjump');
  setMouth(true);setTimeout(()=>setMouth(false),900);
  B.sHappy();if(withHearts!==false)B.hearts(nicko._x,nicko._y-10);
}
setInterval(()=>{
  if(!nicko.classList.contains('walking')){
    nicko.classList.add('blink');setTimeout(()=>nicko.classList.remove('blink'),150);
  }
},3400);

/* ---------- drag & tap engine ---------- */
function interact(el,{drag=true,lift=true,onTap,onDrop}={}){
  let sx,sy,ox,oy,moved,pid;
  el.addEventListener('pointerdown',e=>{
    e.preventDefault();e.stopPropagation();B.wakeAudio();
    pid=e.pointerId;sx=e.clientX;sy=e.clientY;
    ox=el._x||0;oy=el._y||0;moved=false;
    try{el.setPointerCapture(pid);}catch(err){}
    if(lift&&el.classList.contains('sprite'))el.classList.add('lift');
    if(el===nicko)nicko.classList.add('walking');
  });
  el.addEventListener('pointermove',e=>{
    if(e.pointerId!==pid||!drag)return;
    const[ux,uy]=B.toUnits(e.clientX,e.clientY),[oux,ouy]=B.toUnits(sx,sy);
    if(Math.hypot(ux-oux,uy-ouy)>.8)moved=true;
    if(!moved)return;
    const w=parseFloat(el.dataset.w||'10');
    place(el,Math.min(96,Math.max(4,ox+(ux-oux))),Math.min(152,Math.max(14,oy+(uy-ouy))),w);
  });
  const up=e=>{
    if(e.pointerId!==pid)return;pid=null;
    el.classList.remove('lift');nicko.classList.remove('walking');
    if(!moved&&onTap)onTap();
    else if(moved&&onDrop)onDrop();
  };
  el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
}

/* ---------- bathtub: faucet fills, drain empties ---------- */
let tubLevel=0,filling=false,draining=false,fillT=null;
const tubWater=$('tubWater'),tubWaterTop=$('tubWaterTop'),tubStream=$('tubStream');
function renderTub(){
  const h=46*tubLevel,y=80-h;
  tubWater.setAttribute('y',y);tubWater.setAttribute('height',h);
  tubWaterTop.style.display=tubLevel>0.02?'':'none';
  tubWaterTop.setAttribute('cy',y);
  tubStream.setAttribute('height',(filling||draining)?16:0);
}
function stopWater(){filling=false;draining=false;clearInterval(fillT);renderTub();
  if(window.NK)NK.session.set('bathTub',tubLevel);}
interact(tub,{drag:false,onTap(){
  if(filling||draining){stopWater();B.sClick();return;}
  if(tubLevel<0.99){
    filling=true;renderTub();
    fillT=setInterval(()=>{
      tubLevel=Math.min(1,tubLevel+0.025);renderTub();B.sDrip();
      if(tubLevel>=1){stopWater();B.sPop();B.sparkles(tub._x,tub._y-14,8);}
    },110);
  }else{
    draining=true;renderTub();B.sWhoosh();
    fillT=setInterval(()=>{
      tubLevel=Math.max(0,tubLevel-0.04);renderTub();
      if(tubLevel<=0){stopWater();B.sClick();}
    },110);
  }
}});

/* ---------- bath time: the forgiving care loop ---------- */
let bathT=null,washT=null;
nicko._dirty=0;nicko._soapy=false;nicko._rinseT=null;
function happyHopFree(withHearts){
  setMouth(true);setTimeout(()=>setMouth(false),900);
  B.sHappy();if(withHearts!==false)B.hearts(nicko._x,nicko._y-10);
}
function renderMud(){
  const m=$('mudSpots');if(!m)return;
  m.style.display=nicko._dirty>0?'':'none';
  m.setAttribute('opacity',nicko._dirty>=2?'.95':'.7');
  if(window.NK)NK.session.set('bathDirty',nicko._dirty);
}
function bathTime(){
  nicko._inTub=true;nicko._wet=true;
  place(nicko,26,116,15,true);
  B.sSplash();
  for(let i=0;i<6;i++)setTimeout(()=>B.particle('\uD83D\uDCA7',tub._x+(Math.random()*24-12),tub._y-6,'#7FD4E8',24),i*120);
  happyHopFree(nicko._dirty===0);
  bathT=setInterval(()=>B.bubble(tub._x+(Math.random()*26-13),tub._y-4),420);
  washT=setInterval(()=>{
    if(tubLevel>0.3&&nicko._dirty>0){ // water washes mud away, little by little
      nicko._dirty--;renderMud();B.sSplash();
      for(let i=0;i<3;i++)setTimeout(()=>B.particle('\uD83D\uDCA7',nicko._x+(Math.random()*14-7),nicko._y-6,'#7FD4E8',22),i*110);
      if(nicko._dirty===0){B.sHappy();B.sparkles(nicko._x,nicko._y-10,12);}
    }
    if(nicko._soapy&&tubLevel>0.3&&!nicko._rinseT){ // soapy + water = rinsing
      nicko._rinseT=setTimeout(()=>{
        nicko._rinseT=null;nicko._soapy=false;B.sparkles(nicko._x,nicko._y-10,10);B.sPop();
      },2500);
    }
  },1600);
}
function climbOut(){
  nicko._inTub=false;clearInterval(bathT);clearInterval(washT);
  if(nicko._rinseT){clearTimeout(nicko._rinseT);nicko._rinseT=null;}
  place(nicko,54,140,19,true);
  if(nicko._wet){
    nicko.classList.remove('shake');void nicko.offsetWidth;nicko.classList.add('shake');
    B.sSplash();
    for(let i=0;i<4;i++)setTimeout(()=>B.particle('\uD83D\uDCA7',nicko._x+(Math.random()*14-7),nicko._y-6,'#7FD4E8',22),i*110);
  }
}
setInterval(()=>{ // wet and undried: a gentle shiver until the towel comes
  nicko.classList.toggle('shiver',!!(nicko._wet&&!nicko._inTub));
},2000);

/* ---------- towel dries wet Nicko ---------- */
interact(towel,{onTap(){B.sPop();},onDrop(){
  if(near(towel,nicko,12)&&nicko._wet){
    if(nicko._dirty>0){ // towel refuses a muddy Nicko: wash first!
      B.sGiggle();nicko.classList.remove('shake');void nicko.offsetWidth;nicko.classList.add('shake');
      B.sparkles(nicko._x,nicko._y-8,6);
    }else{
      nicko._wet=false;B.sHappy();B.sparkles(nicko._x,nicko._y-8,12);B.hearts(nicko._x,nicko._y-12);
      happyHopFree(false);
    }
  }else if(!near(towel,nicko,12)){
    B.sPop();
  }
  place(towel,towelHome[0],towelHome[1],10,true);
}});

/* ---------- rubber duck ---------- */
interact(duck,{onTap(){
  B.sSqueak();
  duck.classList.remove('bob');void duck.offsetWidth;
  place(duck,duck._x,duck._y-4,9,true);
  setTimeout(()=>place(duck,duck._x,duck._y+4,9,true),200);
  if(duck._float){duck.classList.add('bob');}
},onDrop(){
  if(near(duck,tub,16)&&tubLevel>0.3){
    duck._float=true;duck.classList.add('bob');
    place(duck,36,113,8,true);B.sSqueak();
    B.bubble(36,110);B.bubble(33,112);
  }else{duck._float=false;duck.classList.remove('bob');}
}});

/* ---------- soap: only works on wet fur ---------- */
interact(soap,{onTap(){B.sPop();},onDrop(){
  if(near(soap,nicko,12)){
    for(let i=0;i<8;i++)setTimeout(()=>B.bubble(nicko._x+(Math.random()*16-8),nicko._y-6),i*90);
    if(nicko._wet){ // soap on wet fur: now he's soapy, rinse in water
      nicko._soapy=true;B.sHappy();happyHopFree(false);B.sparkles(nicko._x,nicko._y-10,8);
    }else{ // soap on dry fur: popping bubbles comedy, no shortcut
      nicko.classList.remove('shake');void nicko.offsetWidth;nicko.classList.add('shake');
      B.sPop();setTimeout(()=>B.sPop(),220);
    }
  }
  place(soap,soapHome[0],soapHome[1],7,true);
}});

/* ---------- toilet: lid peekaboo + flush ---------- */
let lidOpen=false;
interact(toilet,{drag:false,onTap(){
  lidOpen=!lidOpen;$('tLid').classList.toggle('open',lidOpen);B.sClick();
}});
interact($('flushH'),{drag:false,lift:false,onTap(e){
  const sw=$('flushSwirl');
  sw.classList.remove('spin');void sw.getBoundingClientRect();sw.classList.add('spin');
  B.sWhoosh();B.sparkles(toilet._x,toilet._y-8,8);
  if(near(nicko,toilet,16)&&nicko._dirty<2){nicko._dirty++;renderMud();B.sPop();} // splash zone!
}});

/* ---------- sink + mirror ---------- */
let sinkOn=false,sinkT=null;
interact(psink,{drag:false,onTap(){
  sinkOn=!sinkOn;
  $('sinkStream').setAttribute('height',sinkOn?14:0);
  if(sinkOn){
    sinkT=setInterval(()=>B.sDrip(),500);
    if(near(nicko,psink,14)&&nicko._dirty<2){nicko._dirty++;renderMud();B.sSplash();} // splashed!
  }else{clearInterval(sinkT);}
  B.sClick();
}});
interact(mirror,{drag:false,onTap(){
  B.sparkles(mirror._x,mirror._y,10);B.sMeow();happyHopFree(false);
}});

/* ---------- door to living room ---------- */
interact(door,{drag:false,onTap(){B.sPop();setTimeout(()=>{window.location.href='../living/';},250);}});

/* ---------- Nicko ---------- */
interact(nicko,{onTap(){
  if(nicko._inTub){climbOut();return;}
  B.sMeow();happyHop(false);
},onDrop(){
  if(near(nicko,tub,16)&&!nicko._inTub){bathTime();return;}
}});

/* ---------- duck cue: Nicko sniffs the duck on his own ---------- */
let lastActBa=0;
game.addEventListener('pointerdown',()=>{lastActBa=Date.now();},true);
setInterval(()=>{
  if(nicko._inTub||nicko.classList.contains('walking')||Date.now()-lastActBa<20000)return;
  if(Math.random()<.5&&!near(nicko,duck,18)){
    nicko.classList.add('walking');
    const dx=duck._x-nicko._x,dy=duck._y-nicko._y,d=Math.hypot(dx,dy)||1;
    place(nicko,nicko._x+dx/d*8,nicko._y+dy/d*8,19,true);
    setTimeout(()=>{nicko.classList.remove('walking');B.sSqueak();},600);
  }
},30000);
$('bg').addEventListener('pointerdown',e=>{
  if(nicko._inTub)return;
  B.wakeAudio();
  const r=game.getBoundingClientRect();
  const[ux,uy]=B.toUnits(e.clientX-r.left,e.clientY-r.top);
  if(ux<0||ux>100||uy<0||uy>160)return;
  nicko.classList.add('walking');
  place(nicko,Math.min(94,Math.max(6,ux)),Math.min(150,Math.max(60,uy)),19,true);
  B.tone(300,.18,'sine',.08,0,520);
  setTimeout(()=>nicko.classList.remove('walking'),650);
});

/* ---------- HUD ---------- */
$('soundBtn').addEventListener('pointerdown',e=>{
  e.stopPropagation();B.wakeAudio();B.muted=!B.muted;if(window.NK)NK.sound=!B.muted;
  $('sndOn').style.display=B.muted?'none':'';$('sndOff').style.display=B.muted?'':'none';
  if(!B.muted)B.sPop();
});
$('hud').addEventListener('pointerdown',e=>e.stopPropagation());
$('resetBtn').addEventListener('pointerdown',e=>{e.stopPropagation();window.location.reload();});

/* ---------- init ---------- */
function init(){
  B.measure();
  place(tub,26,122,38);place(toilet,72,126,19);place(psink,90,94,16);
  place(mirror,90,62,14);place($('rack'),8,66,12);
  place(towel,towelHome[0],towelHome[1],10);
  place(duck,50,134,9);place(soap,soapHome[0],soapHome[1],7);
  place(door,12,44,12);place(nicko,58,138,19);
  if(window.NK){
    const _t=NK.session.get('bathTub');if(_t)tubLevel=_t;
    const _d=NK.session.get('bathDirty');if(_d)nicko._dirty=_d;
  }
  renderTub();renderMud();B.layout();
  if(window.NK){NK.room='bathroom';if(!NK.sound){B.muted=true;$('sndOn').style.display='none';$('sndOff').style.display='';}}
  setTimeout(()=>{B.sMeow();happyHop(false);},1200);
}
window.addEventListener('resize',()=>{B.measure();B.layout();});
window.addEventListener('orientationchange',()=>setTimeout(()=>{B.measure();B.layout();},300));
init();
})();
</script>
</body>
</html>
