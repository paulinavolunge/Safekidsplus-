<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Nicko's Bedroom</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#F7E8D0;font-family:system-ui,sans-serif;
    user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none}
  #game{position:fixed;inset:0;overflow:hidden}
  #bg{position:absolute;inset:0;z-index:0}
  .sprite{position:absolute;z-index:10;touch-action:none;cursor:pointer}
  .sprite svg{width:100%;height:100%;display:block;overflow:visible;pointer-events:none}
  .sprite.lift{z-index:40;filter:drop-shadow(0 10px 10px rgba(0,0,0,.25))}
  .particle{position:absolute;z-index:45;pointer-events:none;font-weight:800}
  .ripple{position:absolute;z-index:20;pointer-events:none;border:3px solid rgba(255,255,255,.85);border-radius:50%;
    transform:translate(-50%,-50%);animation:rip 1s ease-out forwards}
  @keyframes rip{from{width:14px;height:8px;opacity:1}to{width:90px;height:44px;opacity:0}}
  .sparkle{position:absolute;z-index:45;pointer-events:none;animation:spark 1.1s ease-out forwards}
  @keyframes spark{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
  .note{position:absolute;z-index:45;pointer-events:none;font-size:22px;animation:floatUp 2.4s ease-out forwards}
  @keyframes floatUp{0%{transform:translateY(0) rotate(-8deg);opacity:0}15%{opacity:1}100%{transform:translateY(-90px) rotate(10deg);opacity:0}}
  .zzz{position:absolute;z-index:45;pointer-events:none;font-weight:800;color:#8E7CF0;font-size:24px;animation:zfloat 2.8s ease-out forwards}
  @keyframes zfloat{0%{transform:translateY(0) scale(.6);opacity:0}20%{opacity:1}100%{transform:translateY(-70px) translateX(14px) scale(1.25);opacity:0}}
  #dim{position:absolute;inset:0;background:#1A2340;opacity:0;pointer-events:none;transition:opacity .8s;z-index:5}
  #hud{position:absolute;top:calc(10px + env(safe-area-inset-top));right:12px;z-index:50;display:flex;gap:10px}
  .hbtn{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.92);border:2.5px solid #2E2A26;
    display:flex;align-items:center;justify-content:center;box-shadow:2px 2px 0 rgba(46,42,38,.35);cursor:pointer}
  .hbtn:active{transform:scale(.92)}
  .hbtn svg{width:24px;height:24px}
  .curtain{position:absolute;top:0;width:34%;height:100%;z-index:12;transition:transform 1s ease;pointer-events:none}
  #curL{left:0}#curR{right:0}
  .closed-l{transform:translateX(0)}.open-l{transform:translateX(-86%)}
  .closed-r{transform:translateX(0)}.open-r{transform:translateX(86%)}
  #nicko .eyesOpen{transform-box:fill-box;transform-origin:center}
  #nicko.blink .eyesOpen{transform:scaleY(.12)}
  #nicko .tail{transform-box:fill-box;transform-origin:left center;animation:wag 2.6s ease-in-out infinite}
  @keyframes wag{0%,100%{transform:rotate(0)}50%{transform:rotate(24deg)}}
  #nicko .breathe{transform-box:fill-box;transform-origin:center;animation:breath 3s ease-in-out infinite}
  @keyframes breath{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}
  #nicko.walking .breathe{animation:bob .32s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6%)}}
  #nicko.happyjump{animation:hjump .55s ease}
  @keyframes hjump{0%{transform:translateY(0) scale(1)}35%{transform:translateY(-16%) scale(1.04,.94)}70%{transform:translateY(0) scale(.96,1.05)}100%{transform:translateY(0) scale(1)}}
  #nicko.sleeping .breathe{animation:breath 5s ease-in-out infinite}
  .lampglow{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(255,236,170,.85),rgba(255,236,170,0) 70%);
    pointer-events:none;z-index:6;transition:opacity .8s}
</style>
</head>

<script>
(function(){
"use strict";
const game=document.getElementById('game');
let S=1,OX=0,OY=0;
function measure(){
  const w=game.clientWidth,h=game.clientHeight;
  S=Math.max(w/100,h/160); OX=(w-100*S)/2; OY=(h-160*S)/2;
}
const toPx=(x,y)=>[OX+x*S,OY+y*S];
const toUnits=(px,py)=>[(px-OX)/S,(py-OY)/S];
function place(el,x,y,w,animate){
  const[px,py]=toPx(x,y); el._x=x; el._y=y;
  const sz=w*S;
  el.style.width=sz+'px'; el.style.height='auto';
  if(animate){el.style.transition='left .6s ease,top .6s ease';}
  else{el.style.transition='';}
  el.style.left=(px-sz/2)+'px'; el.style.top=(py-sz/2)+'px';
}
function near(a,b,d){const dx=(a._x||0)-(b._x||0),dy=(a._y||0)-(b._y||0);return Math.hypot(dx,dy)<d;}
document.querySelectorAll('.sprite[data-w]').forEach(el=>{
  const svg=el.querySelector('svg'); let r={w:100,h:100};
  if(svg&&svg.viewBox&&svg.viewBox.baseVal){r={w:svg.viewBox.baseVal.width,h:svg.viewBox.baseVal.height};}
  el._ratio=r.h/r.w;
});
function layout(){
  document.querySelectorAll('.sprite[data-w]').forEach(el=>{
    if(el._x===undefined)return;
    const w=parseFloat(el.dataset.w),[px,py]=toPx(el._x,el._y),sz=w*S;
    el.style.width=sz+'px'; el.style.height=(sz*el._ratio)+'px';
    el.style.left=(px-sz/2)+'px'; el.style.top=(py-sz*el._ratio/2)+'px';
  });
  const glow=document.getElementById('lampGlow'),lamp=document.getElementById('lamp');
  if(glow&&lamp._x!==undefined){const[gx,gy]=toPx(lamp._x,lamp._y-9);const s=34*S;
    glow.style.width=s+'px';glow.style.height=s+'px';glow.style.left=(gx-s/2)+'px';glow.style.top=(gy-s/2)+'px';}
}
/* particles */
function particle(txt,x,y,color,size){
  const[px,py]=toPx(x,y);const s=document.createElement('div');
  s.className='particle';s.textContent=txt;
  s.style.cssText=`left:${px}px;top:${py}px;color:${color||'#F0504D'};font-size:${(size||26)*S/5.2}px;transform:translate(-50%,-50%)`;
  game.appendChild(s);
  s.animate([{transform:'translate(-50%,-50%) translateY(0) scale(1)',opacity:1},
    {transform:'translate(-50%,-50%) translateY(-70px) scale(1.3)',opacity:0}],{duration:1100,easing:'ease-out'});
  setTimeout(()=>s.remove(),1150);
}
function hearts(x,y){['#F0504D','#FF8A87','#F0504D'].forEach((c,i)=>setTimeout(()=>particle('\u2665',x+(Math.random()*10-5),y-4,'#F0504D',22),i*160));}
function sparkles(x,y,n){
  const colors=['#FFC93C','#8E7CF0','#3FB6B2','#FF8A87'];
  for(let i=0;i<(n||10);i++){
    const[px,py]=toPx(x,y);const s=document.createElement('div');s.className='sparkle';
    const sz=(8+Math.random()*10);
    s.style.cssText=`left:${px}px;top:${py}px;width:${sz}px;height:${sz}px;background:${colors[i%colors.length]};border-radius:${Math.random()>.5?'50%':'2px'};--dx:${(Math.random()*80-40)}px;--dy:${(Math.random()*80-40)}px`;
    game.appendChild(s);setTimeout(()=>s.remove(),1150);
  }
}
function musicNote(x,y){
  const[px,py]=toPx(x+(Math.random()*8-4),y);const s=document.createElement('div');s.className='note';
  s.textContent=['\u266A','\u266B','\u2669'][Math.floor(Math.random()*3)];s.style.left=px+'px';s.style.top=py+'px';
  s.style.color='#6B5BD2';game.appendChild(s);setTimeout(()=>s.remove(),2450);
}
function zzz(x,y){
  const[px,py]=toPx(x,y);const s=document.createElement('div');s.className='zzz';
  s.textContent='Z';s.style.left=(px+14*S/5.2)+'px';s.style.top=(py-10*S/5.2)+'px';
  game.appendChild(s);setTimeout(()=>s.remove(),2850);
}
/* audio */
let AC=null,muted=false;
function wakeAudio(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){}}
function tone(f,dur,type,vol,when,slideTo){
  if(muted)return;wakeAudio();if(!AC)return;
  try{
    const t=AC.currentTime+(when||0),o=AC.createOscillator(),g=AC.createGain();
    o.type=type||'sine';o.frequency.setValueAtTime(f,t);
    if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,t+dur);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||.2,t+.02);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur+.05);
  }catch(e){}
}
const sClick=()=>tone(700,.08,'triangle',.15);
const sPop=()=>tone(500,.12,'sine',.22,0,900);
const sMeow=()=>{tone(620,.28,'sawtooth',.10,0,920);tone(930,.22,'sawtooth',.07,.12,640);};
const sHappy=()=>{[523,659,784].forEach((f,i)=>tone(f,.16,'triangle',.16,i*.09));};
const sChirp=()=>{tone(2400,.09,'sine',.12);tone(2900,.09,'sine',.12,.11);};
const sThud=()=>tone(140,.14,'sine',.2,0,70);
window.ParkBed={game,measure,place,toPx,toUnits,near,layout,particle,hearts,sparkles,musicNote,zzz,
  tone,sClick,sPop,sMeow,sHappy,sChirp,sThud,wakeAudio,
  get muted(){return muted;},set muted(v){muted=v;}};
})();
</script>

<script>
(function(){
"use strict";
const B=window.ParkBed;
const {game,place,toUnits,near,layout}=B;
const $=id=>document.getElementById(id);
const nicko=$('nicko'),bed=$('bed'),lamp=$('lamp'),bear=$('bear'),musicbox=$('musicbox'),
      win=$('window'),door=$('door'),dim=$('dim'),glow=$('lampGlow'),
      curL=$('curL'),curR=$('curR');
nicko._state='idle';

/* ---------- Nicko face & state ---------- */
function setFace(m){
  nicko.querySelector('.eyesOpen').style.display=m==='open'?'':'none';
  nicko.querySelector('.eyesClosed').style.display=m==='closed'?'':'none';
  nicko.querySelector('.eyesHalf').style.display=m==='half'?'':'none';
}
function setMouth(happy){
  nicko.querySelector('.mouthSmile').style.display=happy?'none':'';
  nicko.querySelector('.mouthHappy').style.display=happy?'':'none';
}
function happyHop(){
  if(nicko._state==='sleep')return;
  nicko.classList.remove('happyjump');void nicko.offsetWidth;nicko.classList.add('happyjump');
  setMouth(true);setTimeout(()=>setMouth(false),900);
  B.sHappy();B.hearts(nicko._x,nicko._y-10);
}
function nickoSleep(){
  if(nicko._state==='sleep')return;
  nicko._state='sleep';nicko.classList.add('sleeping');setFace('closed');setMouth(false);
  place(nicko,66,116,19,true);
  B.sPop();B.sparkles(66,116,8);
  let n=0;nicko._zzzT=setInterval(()=>{B.zzz(nicko._x,nicko._y);if(++n%3===0)B.tone(180,.5,'sine',.05,0,120);},1900);
}
function nickoWake(){
  if(nicko._state!=='sleep')return;
  clearInterval(nicko._zzzT);nicko._state='idle';nicko.classList.remove('sleeping');setFace('open');
  place(nicko,50,126,19,true);B.sMeow();happyHop();
}
setInterval(()=>{ // blinking
  if(nicko._state==='idle'&&!nicko.classList.contains('walking')){
    nicko.classList.add('blink');setTimeout(()=>nicko.classList.remove('blink'),150);
  }
},3400);

/* ---------- drag & tap engine ---------- */
function interact(el,{drag=true,lift=true,onTap,onDrop}={}){
  let sx,sy,ox,oy,moved,pid;
  el.addEventListener('pointerdown',e=>{
    e.preventDefault();e.stopPropagation();B.wakeAudio();
    pid=e.pointerId;sx=e.clientX;sy=e.clientY;ox=el._x;oy=el._y;moved=false;
    try{el.setPointerCapture(pid);}catch(err){}
    if(lift)el.classList.add('lift');
    if(el===nicko)nicko.classList.add('walking');
  });
  el.addEventListener('pointermove',e=>{
    if(e.pointerId!==pid||!drag)return;
    const[ux,uy]=toUnits(e.clientX,e.clientY),[oux,ouy]=toUnits(sx,sy);
    if(Math.hypot(ux-oux,uy-ouy)>.8)moved=true;
    if(!moved)return;
    const w=parseFloat(el.dataset.w);
    place(el,Math.min(96,Math.max(4,ox+(ux-oux))),Math.min(152,Math.max(14,oy+(uy-ouy))),w);
  });
  const up=e=>{
    if(e.pointerId!==pid)return;pid=null;
    el.classList.remove('lift');nicko.classList.remove('walking');
    if(!moved&&onTap)onTap();
    else if(moved&&onDrop)onDrop();
  };
  el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
}

/* ---------- lamp ---------- */
let lampOn=true;
interact(lamp,{drag:false,onTap(){
  lampOn=!lampOn;B.sClick();
  dim.style.opacity=lampOn?'0':'.5';
  glow.style.opacity=lampOn?'1':'0';
}});

/* ---------- window & curtains ---------- */
let curtainsOpen=false;
interact(win,{drag:false,onTap(){
  curtainsOpen=!curtainsOpen;B.sClick();
  curL.className='curtain '+(curtainsOpen?'open-l':'closed-l');
  curR.className='curtain '+(curtainsOpen?'open-r':'closed-r');
  if(curtainsOpen){B.sChirp();B.musicNote(24,40);}
}});

/* ---------- garden door ---------- */
interact(door,{drag:false,onTap(){B.sPop();setTimeout(()=>{window.location.href='../backyard/';},250);}});

/* ---------- bed ---------- */
interact(bed,{drag:false,onTap(){
  if(nicko._state==='sleep'){nickoWake();}
  else{nickoSleep();}
}});

/* ---------- Nicko ---------- */
interact(nicko,{onTap(){
  if(nicko._state==='sleep'){nickoWake();return;}
  if(nicko._state==='drowsy'){nicko._state='idle';setFace('open');}
  B.sMeow();happyHop();
},onDrop(){
  if(near(nicko,bed,24))nickoSleep();
}});

/* tap ground -> Nicko hops over */
$('bg').addEventListener('pointerdown',e=>{
  if(nicko._state==='sleep')return;
  B.wakeAudio();
  const r=game.getBoundingClientRect();
  const[ux,uy]=toUnits(e.clientX-r.left,e.clientY-r.top);
  if(nicko._state==='drowsy'){nicko._state='idle';setFace('open');}
  nicko.classList.add('walking');
  place(nicko,Math.min(94,Math.max(6,ux)),Math.min(150,Math.max(60,uy)),19,true);
  B.tone(300,.18,'sine',.08,0,520);
  setTimeout(()=>nicko.classList.remove('walking'),650);
});

/* ---------- bear hugs ---------- */
interact(bear,{onTap(){B.sPop();B.hearts(bear._x,bear._y-6);},onDrop(){
  if(nicko._state!=='sleep'&&near(bear,nicko,13)){
    const now=Date.now();if(bear._cool&&now-bear._cool<3000)return;bear._cool=now;
    B.sMeow();happyHop();B.sparkles(nicko._x,nicko._y-8,8);
  }
}});

/* ---------- blocks ---------- */
const blocks=[$('block1'),$('block2'),$('block3'),$('block4')];
blocks.forEach(b=>{
  interact(b,{onTap(){B.sPop();},onDrop(){
    B.sThud();
    blocks.forEach(o=>{if(o._on===b){o._on=null;place(o,o._x,143,9,true);}}); // topple rider
    b._on=null;
    for(const o of blocks){
      if(o!==b&&Math.abs(b._x-o._x)<7&&b._y<o._y&&(o._y-b._y)<13){
        place(b,o._x,o._y-8.6,9);b._on=o;B.sPop();break;
      }
    }
    let h=1,o=b._on;while(o){h++;o=o._on;}
    if(h>=3){B.sparkles(b._x,b._y-10,14);if(nicko._state!=='sleep'){B.sHappy();happyHop();}}
  }});
});

/* ---------- music box ---------- */
let playing=false,playT=null,drowsyT=null;
const melody=[523,587,659,784,880,784,659,587,523,587,659,523,440,523,587,659,523,0];
let mi=0;
interact(musicbox,{drag:false,onTap(){
  B.wakeAudio();B.sClick();
  if(playing){stopMusic();return;}
  playing=true;mi=0;
  playT=setInterval(()=>{
    const f=melody[mi%melody.length];mi++;
    if(f){B.tone(f,.5,'triangle',.14);B.tone(f*2,.3,'sine',.04);B.musicNote(musicbox._x,musicbox._y-8);}
  },460);
  drowsyT=setTimeout(()=>{
    if(playing&&nicko._state==='idle'){nicko._state='drowsy';setFace('half');}
  },7000);
}});
function stopMusic(){playing=false;clearInterval(playT);clearTimeout(drowsyT);
  if(nicko._state==='drowsy'){nicko._state='idle';setFace('open');}}

/* ---------- HUD ---------- */
$('soundBtn').addEventListener('pointerdown',e=>{
  e.stopPropagation();B.wakeAudio();B.muted=!B.muted;
  $('sndOn').style.display=B.muted?'none':'';$('sndOff').style.display=B.muted?'':'none';
  if(!B.muted)B.sPop();
});
$('hud').addEventListener('pointerdown',e=>e.stopPropagation());
$('resetBtn').addEventListener('pointerdown',e=>{e.stopPropagation();window.location.reload();});

/* ---------- init ---------- */
function init(){
  B.measure();
  place(win,24,42,30);place(door,90,84,13);
  place(bed,77,122,40);place($('stand'),52,124,16);place(lamp,52,108,13);
  place($('dresser'),22,128,26);place(musicbox,22,115.5,11);
  place(bear,32,134,12);
  place($('block1'),58,142,9);place($('block2'),68,143,9);
  place($('block3'),78,141,9);place($('block4'),40,143,9);
  place(nicko,50,124,19);
  B.layout();
  glow.style.opacity='1';
  setTimeout(()=>{if(nicko._state==='idle'){B.sMeow();happyHop();}},1200); // hello!
}
window.addEventListener('resize',()=>{B.measure();B.layout();});
window.addEventListener('orientationchange',()=>setTimeout(()=>{B.measure();B.layout();},300));
init();
})();
</script>
</body>
</html>
