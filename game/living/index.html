<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Nicko's Living Room</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#F6E7D3;font-family:system-ui,sans-serif;
    user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none}
  #game{position:fixed;inset:0;overflow:hidden}
  #bg{position:absolute;inset:0;z-index:0;background:linear-gradient(to bottom,#F6E7D3 0%,#F6E7D3 70%,#DFA96F 70%,#DFA96F 100%)}
  .sprite{position:absolute;z-index:10;touch-action:none;cursor:pointer}
  .sprite svg{width:100%;height:100%;display:block;overflow:visible;pointer-events:none}
  .sprite.lift{z-index:40;filter:drop-shadow(0 10px 10px rgba(0,0,0,.25))}
  .particle{position:absolute;z-index:45;pointer-events:none;font-weight:800}
  .sparkle{position:absolute;z-index:45;pointer-events:none;animation:spark 1.1s ease-out forwards}
  @keyframes spark{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
  #hud{position:absolute;top:calc(10px + env(safe-area-inset-top));right:12px;z-index:50;display:flex;gap:10px}
  .hbtn{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.92);border:2.5px solid #2E2A26;
    display:flex;align-items:center;justify-content:center;box-shadow:2px 2px 0 rgba(46,42,38,.35);cursor:pointer}
  .hbtn:active{transform:scale(.92)}
  .hbtn svg{width:24px;height:24px}
  .lampglow{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(255,236,170,.85),rgba(255,236,170,0) 70%);
    pointer-events:none;z-index:6;transition:opacity .8s}
  #sofa.boing{animation:boing .5s ease}
  @keyframes boing{0%{transform:scale(1)}30%{transform:scale(1.06,.88)}60%{transform:scale(.97,1.05)}100%{transform:scale(1)}}
  #plant.wiggle{animation:wiggle .6s ease}
  @keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-7deg)}50%{transform:rotate(6deg)}75%{transform:rotate(-4deg)}}
  .fishswim{animation:swim 5s linear infinite}
  @keyframes swim{from{transform:translateX(-34px)}to{transform:translateX(112px)}}
  .ballbounce{animation:bball 1.1s ease-in-out infinite}
  @keyframes bball{0%,100%{transform:translateY(0)}50%{transform:translateY(-22px)}}
  .twinkle{animation:twk 1.4s ease-in-out infinite}
  .twinkle.d2{animation-delay:.5s}.twinkle.d3{animation-delay:.9s}
  @keyframes twk{0%,100%{opacity:.25}50%{opacity:1}}
  .wheelspin{transform-box:fill-box;transform-origin:center;animation:spin .4s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  #nicko .eyesOpen{transform-box:fill-box;transform-origin:center}
  #nicko.blink .eyesOpen{transform:scaleY(.12)}
  #nicko .tail{transform-box:fill-box;transform-origin:left center;animation:wag 2.6s ease-in-out infinite}
  @keyframes wag{0%,100%{transform:rotate(0)}50%{transform:rotate(24deg)}}
  #nicko .breathe{transform-box:fill-box;transform-origin:center;animation:breath 3s ease-in-out infinite}
  @keyframes breath{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}
  #nicko.walking .breathe{animation:bob .32s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6%)}}
  #nicko.happyjump{animation:hjump .55s ease}
  @keyframes hjump{0%{transform:translateY(0) scale(1)}35%{transform:translateY(-16%) scale(1.04,.94)}70%{transform:translateY(0) scale(.96,1.05)}100%{transform:translateY(0) scale(1)}}
  #nicko.lounge .breathe{animation:breath 5s ease-in-out infinite}
  #feather.wave{animation:fwave .5s ease}
  @keyframes fwave{0%,100%{transform:rotate(0)}30%{transform:rotate(-18deg)}60%{transform:rotate(14deg)}}
</style>
</head>

function measure(){
  const w=game.clientWidth,h=game.clientHeight;
  S=Math.min(w/100,h/160); OX=(w-100*S)/2; OY=(h-160*S)/2;
}
const toPx=(x,y)=>[OX+x*S,OY+y*S];
const toUnits=(px,py)=>[(px-OX)/S,(py-OY)/S];
function place(el,x,y,w,animate){
  const[px,py]=toPx(x,y); el._x=x; el._y=y;
  const sz=w*S;
  el.style.width=sz+'px'; el.style.height='auto';
  el.style.transition=animate?'left .6s ease,top .6s ease':'';
  el.style.left=(px-sz/2)+'px'; el.style.top=(py-sz/2)+'px';
}
function near(a,b,d){const dx=(a._x||0)-(b._x||0),dy=(a._y||0)-(b._y||0);return Math.hypot(dx,dy)<d;}
document.querySelectorAll('.sprite[data-w]').forEach(el=>{
  const svg=el.querySelector('svg'); let r={w:100,h:100};
  if(svg&&svg.viewBox&&svg.viewBox.baseVal){r={w:svg.viewBox.baseVal.width,h:svg.viewBox.baseVal.height};}
  el._ratio=r.h/r.w;
});
function layout(){
  document.querySelectorAll('.sprite[data-w]').forEach(el=>{
    if(el._x===undefined||el.style.display==='none')return;
    const w=parseFloat(el.dataset.w),[px,py]=toPx(el._x,el._y),sz=w*S;
    el.style.width=sz+'px'; el.style.height=(sz*el._ratio)+'px';
    el.style.left=(px-sz/2)+'px'; el.style.top=(py-sz*el._ratio/2)+'px';
  });
  const glow=document.getElementById('flampGlow'),lp=document.getElementById('flamp');
  if(glow&&lp._x!==undefined){const[gx,gy]=toPx(lp._x,lp._y-16);const s=30*S;
    glow.style.width=s+'px';glow.style.height=s+'px';glow.style.left=(gx-s/2)+'px';glow.style.top=(gy-s/2)+'px';}
}
function particle(txt,x,y,color,size){
  const[px,py]=toPx(x,y);const s=document.createElement('div');
  s.className='particle';s.textContent=txt;
  s.style.cssText=`left:${px}px;top:${py}px;color:${color||'#F0504D'};font-size:${(size||26)*S/5.2}px;transform:translate(-50%,-50%)`;
  game.appendChild(s);
  s.animate([{transform:'translate(-50%,-50%) translateY(0) scale(1)',opacity:1},
    {transform:'translate(-50%,-50%) translateY(-70px) scale(1.3)',opacity:0}],{duration:1100,easing:'ease-out'});
  setTimeout(()=>s.remove(),1150);
}
function hearts(x,y){['#F0504D','#FF8A87','#F0504D'].forEach((c,i)=>setTimeout(()=>particle('\u2665',x+(Math.random()*10-5),y-4,'#F0504D',22),i*160));}
function sparkles(x,y,n){
  const colors=['#FFC93C','#8E7CF0','#3FB6B2','#FF8A87'];
  for(let i=0;i<(n||10);i++){
    const[px,py]=toPx(x,y);const s=document.createElement('div');s.className='sparkle';
    const sz=(8+Math.random()*10);
    s.style.cssText=`left:${px}px;top:${py}px;width:${sz}px;height:${sz}px;background:${colors[i%colors.length]};border-radius:${Math.random()>.5?'50%':'2px'};--dx:${(Math.random()*80-40)}px;--dy:${(Math.random()*80-40)}px`;
    game.appendChild(s);setTimeout(()=>s.remove(),1150);
  }
}
let AC=null,muted=window.NK?!NK.sound:false;
function wakeAudio(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){}}
function tone(f,dur,type,vol,when,slideTo){
  if(muted)return;wakeAudio();if(!AC)return;
  try{
    const t=AC.currentTime+(when||0),o=AC.createOscillator(),g=AC.createGain();
    o.type=type||'sine';o.frequency.setValueAtTime(f,t);
    if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,t+dur);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||.2,t+.02);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur+.05);
  }catch(e){}
}
const sClick=()=>tone(700,.08,'triangle',.15);
const sPop=()=>tone(500,.12,'sine',.22,0,900);
const sMeow=()=>{tone(620,.28,'sawtooth',.10,0,920);tone(930,.22,'sawtooth',.07,.12,640);};
const sHappy=()=>{[523,659,784].forEach((f,i)=>tone(f,.16,'triangle',.16,i*.09));};
const sMunch=()=>{for(let i=0;i<3;i++)tone(180+Math.random()*120,.09,'square',.10,i*.13);};
const sBoing=()=>tone(200,.25,'sine',.16,0,600);
const sVroom=()=>{tone(120,.5,'sawtooth',.10,0,400);tone(90,.5,'sawtooth',.08,.1,350);};
const sThud=()=>tone(140,.14,'sine',.2,0,70);
const sChirp=()=>{tone(2400,.09,'sine',.12);tone(2900,.09,'sine',.12,.11);};
const sJingle=()=>{[523,659,784,1047].forEach((f,i)=>tone(f,.14,'triangle',.13,i*.08));};
const sPurr=()=>tone(85,.5,'sawtooth',.045,0,70);
window.ParkLiving={game,measure,place,toPx,toUnits,near,layout,particle,hearts,sparkles,
  tone,sClick,sPop,sMeow,sHappy,sMunch,sBoing,sVroom,sThud,sChirp,sJingle,sPurr,wakeAudio,
  get muted(){return muted;},set muted(v){muted=v;}};
})();
</script>

<script>
(function(){
"use strict";
const B=window.ParkLiving;
const {game,place,near,layout}=B;
const $=id=>document.getElementById(id);
const nicko=$('nicko'),sofa=$('sofa'),tv=$('tv'),shelf=$('shelf'),looseBook=$('looseBook'),
  flamp=$('flamp'),flampGlow=$('flampGlow'),plant=$('plant'),toybox=$('toybox'),
  ball=$('ball'),car=$('car'),feather=$('feather'),door=$('door'),
  ctable=$('ctable'),plate=$('plate');
const cookies=[$('cookie1'),$('cookie2'),$('cookie3')];
const cookieHome={cookie1:[48,109],cookie2:[52,108],cookie3:[56,109]};
const toyHome={ball:[54,140],car:[62,138],feather:[46,130]};
[ball,car,feather].forEach(t=>{t._tidy=false;t._w=parseFloat(t.dataset.w);});

/* ---------- Nicko face ---------- */
function setFace(m){
  nicko.querySelector('.eyesOpen').style.display=m==='open'?'':'none';
  nicko.querySelector('.eyesClosed').style.display=m==='closed'?'':'none';
  nicko.querySelector('.eyesHalf').style.display=m==='half'?'':'none';
}
function setMouth(happy){
  nicko.querySelector('.mouthSmile').style.display=happy?'none':'';
  nicko.querySelector('.mouthHappy').style.display=happy?'':'none';
}
function happyHop(withHearts){
  if(nicko._lounge)return;
  nicko.classList.remove('happyjump');void nicko.offsetWidth;nicko.classList.add('happyjump');
  setMouth(true);setTimeout(()=>setMouth(false),900);
  B.sHappy();if(withHearts!==false)B.hearts(nicko._x,nicko._y-10);
}
setInterval(()=>{
  if(!nicko.classList.contains('walking')){
    nicko.classList.add('blink');setTimeout(()=>nicko.classList.remove('blink'),150);
  }
},3400);

/* ---------- drag & tap engine ---------- */
function interact(el,{drag=true,lift=true,onTap,onDrop}={}){
  let sx,sy,ox,oy,moved,pid;
  el.addEventListener('pointerdown',e=>{
    e.preventDefault();e.stopPropagation();B.wakeAudio();
    pid=e.pointerId;sx=e.clientX;sy=e.clientY;ox=el._x;oy=el._y;moved=false;
    try{el.setPointerCapture(pid);}catch(err){}
    if(lift)el.classList.add('lift');
    if(el===nicko)nicko.classList.add('walking');
  });
  el.addEventListener('pointermove',e=>{
    if(e.pointerId!==pid||!drag)return;
    const[ux,uy]=B.toUnits(e.clientX,e.clientY),[oux,ouy]=B.toUnits(sx,sy);
    if(Math.hypot(ux-oux,uy-ouy)>.8)moved=true;
    if(!moved)return;
    const w=parseFloat(el.dataset.w);
    place(el,Math.min(96,Math.max(4,ox+(ux-oux))),Math.min(152,Math.max(14,oy+(uy-ouy))),w);
  });
  const up=e=>{
    if(e.pointerId!==pid)return;pid=null;
    el.classList.remove('lift');nicko.classList.remove('walking');
    if(!moved&&onTap)onTap();
    else if(moved&&onDrop)onDrop();
  };
  el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
}

/* ---------- sofa lounge ---------- */
let purrT=null;
interact(sofa,{drag:false,onTap(){
  sofa.classList.remove('boing');void sofa.offsetWidth;sofa.classList.add('boing');B.sBoing();
}});
function lounge(){
  nicko._lounge=true;nicko.classList.add('lounge');setFace('half');
  place(nicko,30,110,15,true);B.sPop();
  purrT=setInterval(()=>B.sPurr(),2000);
}
function unlounge(){
  nicko._lounge=false;nicko.classList.remove('lounge');setFace('open');
  clearInterval(purrT);place(nicko,46,134,19,true);B.sMeow();
}

/* ---------- TV channels ---------- */
let tvCh=-1;
const chEls=[$('chFish'),$('chBall'),$('chStars')];
interact(tv,{drag:false,onTap(){
  tvCh=(tvCh+2)%4-1; // -1 -> 0 -> 1 -> 2 -> -1
  const on=tvCh>=0;
  $('tvScreenOn').style.display=on?'':'none';
  $('tvScreenOff').style.display=on?'none':'';
  $('tvLed').setAttribute('fill',on?'#F0504D':'#5A6268');
  chEls.forEach((c,i)=>c.style.display=(on&&i===tvCh)?'':'none');
  B.sJingle();
  if(on)B.sparkles(tv._x,tv._y-8,6);
}});

/* ---------- bookshelf ---------- */
let bookOut=false;
interact(shelf,{drag:false,onTap(){
  if(bookOut)return;bookOut=true;
  looseBook.style.display='';place(looseBook,7,100,8);B.layout();
  setTimeout(()=>{place(looseBook,17,126,8,true);B.sThud();},60);
}});
interact(looseBook,{drag:false,onTap(){
  place(looseBook,7,96,8,true);B.sPop();
  setTimeout(()=>{looseBook.style.display='none';bookOut=false;},650);
}});

/* ---------- lamp & plant ---------- */
let flampOn=true;
interact(flamp,{drag:false,onTap(){
  flampOn=!flampOn;B.sClick();flampGlow.style.opacity=flampOn?'1':'0';
}});
interact(plant,{drag:false,onTap(){
  plant.classList.remove('wiggle');void plant.offsetWidth;plant.classList.add('wiggle');
  $('plantFlower').style.display='';B.sChirp();B.sparkles(plant._x,plant._y-10,6);
}});

/* ---------- toys: roll, vroom, bat, tidy ---------- */
function tidyCheck(){
  if([ball,car,feather].every(t=>t._tidy)){
    B.sHappy();B.sparkles(toybox._x,toybox._y-10,16);
    if(!nicko._lounge)happyHop(false);
    // the room itself brightens: tidy feels different
    flampGlow.style.transition='opacity .6s';flampGlow.style.opacity='1';
    setTimeout(()=>{flampGlow.style.opacity=flampOn?'1':'0';},2500);
    setTimeout(()=>{
      [ball,car,feather].forEach(t=>{
        t._tidy=false;t.style.display='';
        const[hx,hy]=toyHome[t.id];place(t,hx,hy,t._w);B.sPop();
      });
    },3500);
  }
}
function tidyToy(t){
  t._tidy=true;t.style.display='none';B.sPop();B.sparkles(toybox._x,toybox._y-8,8);
  tidyCheck();
}
interact(ball,{onTap(){B.sPop();},onDrop(){
  if(near(ball,toybox,13)){tidyToy(ball);return;}
  if(ball._rolling)return;ball._rolling=true;
  const batted=!nicko._lounge&&near(ball,nicko,14); // Nicko bats it himself
  let vx=(Math.random()<.5?-1:1)*(24+Math.random()*14);
  B.sBoing();
  if(batted){B.sMeow();happyHop(false);}
  const roll=setInterval(()=>{
    let nx=ball._x+vx*0.04;vx*=0.965;
    if(nx<6){nx=6;vx*=-0.7;B.sThud();}if(nx>94){nx=94;vx*=-0.7;B.sThud();}
    place(ball,nx,ball._y,9);
    if(Math.abs(vx)<2){clearInterval(roll);ball._rolling=false;}
  },40);
}});
interact(car,{onTap(){B.sPop();},onDrop(){
  if(near(car,toybox,13)){tidyToy(car);return;}
  if(car._rolling)return;car._rolling=true;
  const noticed=!nicko._lounge&&near(car,nicko,15);
  const dir=(car._x>50?-1:1);
  $('wheel1').classList.add('wheelspin');$('wheel2').classList.add('wheelspin');
  B.sVroom();
  if(noticed){ // Nicko scoots over to watch the car go
    const d2=nicko._x<car._x?-1:1;
    nicko.classList.add('walking');
    place(nicko,Math.min(94,Math.max(6,nicko._x+d2*8)),nicko._y,19,true);
    setTimeout(()=>nicko.classList.remove('walking'),500);
    setTimeout(()=>B.sMeow(),450);
  }
  let vx=dir*44,n=0;
  const roll=setInterval(()=>{
    n++;let nx=car._x+vx*0.04;vx*=0.97;
    if(nx<8){nx=8;vx=0;B.sThud();}if(nx>92){nx=92;vx=0;B.sThud();}
    place(car,nx,car._y,12);
    if(Math.abs(vx)<3||n>40){clearInterval(roll);car._rolling=false;
      $('wheel1').classList.remove('wheelspin');$('wheel2').classList.remove('wheelspin');}
  },40);
}});
interact(feather,{onTap(){B.sPop();},onDrop(){
  if(near(feather,toybox,13)){tidyToy(feather);return;}
  if(near(feather,nicko,13)){
    feather.classList.remove('wave');void feather.offsetWidth;feather.classList.add('wave');
    B.sChirp();happyHop(false);
  }
}});
interact(toybox,{drag:false,onTap(){B.sPop();B.sparkles(toybox._x,toybox._y-8,6);}});

/* ---------- cookies ---------- */
cookies.forEach(c=>{
  interact(c,{onTap(){B.sPop();},onDrop(){
    if(near(c,nicko,10)){
      c.style.display='none';B.sMunch();B.hearts(nicko._x,nicko._y-10);happyHop(false);
      setTimeout(()=>{
        const[hx,hy]=cookieHome[c.id];c.style.display='';place(c,hx,hy,5);B.sPop();
      },5000);
    }
  }});
});

/* ---------- kitchen door ---------- */
interact(door,{drag:false,onTap(){B.sPop();setTimeout(()=>{window.location.href='../kitchen/';},250);}});

/* ---------- Nicko ---------- */
interact(nicko,{onTap(){
  if(nicko._lounge){unlounge();return;}
  B.sMeow();happyHop(false);
},onDrop(){
  if(near(nicko,sofa,18)&&!nicko._lounge){lounge();return;}
}});

/* ---------- sofa invitation: a gentle cue, never a demand ---------- */
let lastActL=0;
game.addEventListener('pointerdown',()=>{lastActL=Date.now();},true);
setInterval(()=>{
  if(nicko._lounge||nicko.classList.contains('walking')||Date.now()-lastActL<20000)return;
  if(Math.random()<.5){
    B.tone(140,.8,'sine',.07,0,90); // soft purr
    B.sparkles(sofa._x,sofa._y-12,5);
  }
},30000);
$('bg').addEventListener('pointerdown',e=>{
  if(nicko._lounge)return;
  B.wakeAudio();
  const r=game.getBoundingClientRect();
  const[ux,uy]=B.toUnits(e.clientX-r.left,e.clientY-r.top);
  if(ux<0||ux>100||uy<0||uy>160)return;
  nicko.classList.add('walking');
  place(nicko,Math.min(94,Math.max(6,ux)),Math.min(150,Math.max(60,uy)),19,true);
  B.tone(300,.18,'sine',.08,0,520);
  setTimeout(()=>nicko.classList.remove('walking'),650);
});

/* ---------- HUD ---------- */
$('soundBtn').addEventListener('pointerdown',e=>{
  e.stopPropagation();B.wakeAudio();B.muted=!B.muted;if(window.NK)NK.sound=!B.muted;
  $('sndOn').style.display=B.muted?'none':'';$('sndOff').style.display=B.muted?'':'none';
  if(!B.muted)B.sPop();
});
$('hud').addEventListener('pointerdown',e=>e.stopPropagation());
$('resetBtn').addEventListener('pointerdown',e=>{e.stopPropagation();window.location.reload();});

/* ---------- init ---------- */
function init(){
  B.measure();
  place(sofa,30,118,32);place(tv,76,92,22);place($('tvstand'),76,106,24);
  place(shelf,7,98,14);place(looseBook,7,100,8);
  place(flamp,93,116,10);place(plant,68,134,11);
  place(toybox,50,136,18);
  place(ball,54,140,9);place(car,62,138,12);place(feather,46,130,10);
  place(ctable,52,120,24);place(plate,52,111,12);
  place($('cookie1'),48,109,5);place($('cookie2'),52,108,5);place($('cookie3'),56,109,5);
  place(door,90,54,12);place(nicko,38,138,19);
  B.layout();flampGlow.style.opacity='1';
  if(window.NK){NK.room='living';if(!NK.sound){B.muted=true;$('sndOn').style.display='none';$('sndOff').style.display='';}}
  setTimeout(()=>{B.sMeow();happyHop(false);},1200);
}
window.addEventListener('resize',()=>{B.measure();B.layout();});
window.addEventListener('orientationchange',()=>setTimeout(()=>{B.measure();B.layout();},300));
init();
})();
</script>
</body>
</html>
